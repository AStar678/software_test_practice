<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>潘多拉 · 本地业务演示</title>
<style>
:root{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:#1f2937;background:#f6f8fc;font-size:16px}*{box-sizing:border-box}body{margin:0}header{border-bottom:1px solid #e3e7ee;background:#fff;padding:22px max(20px,calc((100vw - 1200px)/2));display:flex;gap:18px;align-items:center;justify-content:space-between}h1{font-size:23px;letter-spacing:.04em;margin:0;color:#19364b}h2{font-size:22px;color:#19364b;margin:0 0 16px}h3{font-size:17px;margin:0 0 12px}p{line-height:1.6;margin:8px 0}small,.muted{color:#697586;font-size:13px}.badge{padding:4px 9px;border-radius:6px;background:#eaf0ff;color:#1e40af;font-size:13px;white-space:nowrap}main{max-width:1240px;margin:26px auto;padding:0 20px}.login{max-width:470px;margin:62px auto}.panel,.card{background:#fff;border:1px solid #e3e7ee;border-radius:12px;padding:22px}.card p{white-space:pre-wrap;overflow-wrap:anywhere}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:16px}.toolbar{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:20px}.actions{display:flex;gap:9px;flex-wrap:wrap;align-items:center}button,select,input,textarea{font:inherit}button{border:1px solid #d6dfea;background:#fff;color:#1e40af;padding:10px 15px;border-radius:8px;cursor:pointer;min-height:42px}button:hover{background:#eef4ff}button.primary{background:#2563eb;color:#fff;border-color:#2563eb}button.danger{color:#a52121}button:disabled{opacity:.5;cursor:wait}input,select,textarea{width:100%;border:1px solid #d6dfea;border-radius:8px;padding:10px;background:white;color:#1f2937}textarea{min-height:110px;resize:vertical}label{display:block;margin:15px 0 7px;font-size:14px;color:#374151}select[multiple]{min-height:145px}nav{display:flex;gap:6px;overflow-x:auto;padding:0 0 18px;border-bottom:1px solid #e3e7ee;margin-bottom:23px}nav button{white-space:nowrap;border:none;background:transparent;color:#526075}nav button.active{color:#1e40af;background:#eaf0ff}.notice{margin:16px 0;padding:12px 16px;background:#fff8e5;border:1px solid #e8d9ac;border-radius:8px;line-height:1.5}.error{background:#fff0f0;color:#991b1b;border-color:#e5bcbc}.success{background:#ecf7f2;color:#166534;border-color:#b9dbc6}.empty{padding:40px;text-align:center;color:#697586}.count{font-size:32px;color:#19364b;font-weight:650}table{border-collapse:collapse;width:100%;font-size:14px}td,th{text-align:left;padding:12px 9px;border-bottom:1px solid #e3e7ee;overflow-wrap:anywhere}th{background:#f1f5fa;color:#526075}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f6f8fc;border-radius:8px;padding:15px;font-size:13px;line-height:1.5}dialog{border:none;border-radius:14px;padding:0;max-width:720px;width:calc(100vw - 32px);max-height:90vh;box-shadow:0 18px 60px #19364b33}dialog::backdrop{background:#19364b66}.dialog-head{position:sticky;top:0;background:white;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #e3e7ee;padding:17px 22px}.dialog-head h2{margin:0}.dialog-body{padding:22px}.checkrow{display:flex;align-items:center;gap:9px}.checkrow input{width:auto}.inline{display:grid;grid-template-columns:1fr 1fr;gap:14px}.tablewrap{overflow-x:auto}footer{max-width:1200px;margin:32px auto;padding:20px;color:#697586;font-size:13px;border-top:1px solid #e3e7ee}@media(max-width:650px){header{align-items:flex-start;padding:18px}.toolbar{align-items:flex-start;flex-direction:column}.inline{grid-template-columns:1fr}.panel,.card{padding:17px}main{padding:0 12px}.grid{grid-template-columns:1fr}}
.card,.panel{min-width:0;overflow-wrap:anywhere}h2,h3{overflow-wrap:anywhere}.dialog-head h2{min-width:0}.dialog-head button{flex-shrink:0}
</style>

<body>
<header><div><h1>潘多拉 <span class="badge">本地演示</span></h1><p class="muted">验证任务协作、审批与组织权限</p></div><div id="identity"></div></header>
<main><div id="message" role="status" aria-live="polite"></div><section id="app"></section></main>
<footer>此页面是本地业务演示与接口调试入口。写入会保存在当前 MySQL 数据库；分析使用规则提示，未连接模型服务。</footer>
<dialog id="modal"><div class="dialog-head"><h2 id="modal-title"></h2><button id="close-modal" aria-label="关闭详情">关闭</button></div><div id="modal-body" class="dialog-body"></div></dialog>
<script>
'use strict';
const app=document.querySelector('#app'),notice=document.querySelector('#message'),identity=document.querySelector('#identity');
const modal=document.querySelector('#modal'),modalBody=document.querySelector('#modal-body');
let token='',user=null,tab='tasks',people=[],revision=0;
const names={todo:'待开始',doing:'进行中',done:'已完成',pending:'待审核',approved:'已通过',rejected:'已退回',withdrawn:'已撤销',direct:'免审生效',create:'创建',change:'修改',progress:'进展',complete:'完成',reopen:'重开',urgent:'紧急',high:'高',medium:'中',low:'低',upper:'上层',middle:'中层',lower:'下层',admin:'管理员'};
function node(tag,props={},...children){const e=document.createElement(tag);for(const [k,v] of Object.entries(props)){if(k.startsWith('on'))e.addEventListener(k.slice(2),v);else if(k==='class')e.className=v;else if(k==='text')e.textContent=v;else e.setAttribute(k,v);}for(const c of children.flat())if(c!=null)e.append(c instanceof Node?c:document.createTextNode(String(c)));return e;}
function button(text,action,kind=''){return node('button',{type:'button',class:kind,onclick:async(e)=>{const b=e.currentTarget;b.disabled=true;try{await action();}catch(ex){message(ex.message,true);}finally{b.disabled=false;}}},text);}
function message(text,error=false){notice.replaceChildren(node('div',{class:'notice '+(error?'error':'success')},text));}
function tag(value){return node('span',{class:'badge'},names[value]||value);}
function json(data){return node('pre',{},JSON.stringify(data,null,2));}
function date(value){return value?new Date(value).toLocaleString('zh-CN',{hour12:false}):'—';}
function username(id){return people.find(p=>p.id===id)?.displayName||(id===user?.id?user.displayName:id?'相关人员（资料受限）':'—');}
async function api(path,{method='GET',body,etag}={}){const oldToken=token;const headers={'Content-Type':'application/json'};if(token)headers.Authorization='Bearer '+token;if(!['GET','HEAD'].includes(method))headers['Idempotency-Key']=crypto.randomUUID();if(etag)headers['If-Match']=etag;let response;try{response=await fetch('/api/v1'+path,{method,headers,body:body===undefined?undefined:JSON.stringify(body)});}catch{throw Error('无法连接本地服务，请确认后端正在运行。');}let data;try{data=await response.json();}catch{data={message:'服务返回了无法读取的响应'};}if(oldToken!==token)throw Error('登录状态已变化，请刷新当前页面。');if(!response.ok)throw Error((data.message||data.detail||'操作未完成')+'（'+response.status+'）');return {data,etag:response.headers.get('ETag')};}
function showModal(title,body){document.querySelector('#modal-title').textContent=title;modalBody.replaceChildren(body);if(!modal.open)modal.showModal();}
document.querySelector('#close-modal').addEventListener('click',()=>modal.close());
function inputField(form,label,name,type='text',value='',required=true){const id='f-'+name;const input=node(type==='textarea'?'textarea':'input',{id,name,...(type!=='textarea'?{type}:{}),...(required?{required:''}:{})});input.value=value;form.append(node('label',{for:id},label),input);return input;}
function actionForm(title,build,submit){const form=node('form');build(form);form.append(node('div',{class:'actions',style:'margin-top:22px'},node('button',{type:'submit',class:'primary'},'提交')));form.addEventListener('submit',async(e)=>{e.preventDefault();const b=form.querySelector('[type=submit]');b.disabled=true;try{await submit(new FormData(form));modal.close();message('操作已提交，页面已刷新。');await render();}catch(ex){form.querySelector('.form-error')?.remove();form.prepend(node('div',{class:'notice error form-error',role:'alert'},ex.message));}finally{b.disabled=false;}});showModal(title,form);}
function login(){identity.replaceChildren();const f=node('form',{class:'panel login'},node('h2',{},'登录演示账号'),node('p',{class:'muted'},'不同账号的数据范围和操作权限由服务端判断。'));const u=inputField(f,'账号','username','text','employee');u.autocomplete='username';const pw=inputField(f,'密码','password','password','');pw.autocomplete='current-password';f.append(node('p',{class:'muted'},'演示账号：upper、middle、employee、colleague、market、marketing、admin。初始密码见本地启动说明。'),node('button',{type:'submit',class:'primary',style:'margin-top:18px;width:100%'},'登录'));f.addEventListener('submit',async e=>{e.preventDefault();const b=f.querySelector('[type=submit]');b.disabled=true;try{const r=await api('/auth/sessions',{method:'POST',body:{username:u.value,password:pw.value}});token=r.data.token;user=r.data.user;people=[];tab=user.role==='admin'?'admin':'tasks';notice.replaceChildren();await render();}catch(ex){message(ex.message,true);}finally{b.disabled=false;}});app.replaceChildren(f);}
async function logout(){try{await api('/auth/sessions/current',{method:'DELETE'});}finally{token='';user=null;people=[];revision++;modal.close();notice.replaceChildren();login();}}
async function render(){if(!token)return login();const current=++revision;identity.replaceChildren(node('div',{class:'actions'},node('span',{},user.displayName+' · '+(names[user.role]||user.role)),button('退出',logout)));const tabs=user.role==='admin'?[['admin','管理查询']]:[['home','首页'],['tasks','任务'],['approvals','申请与审核'],['logs','工作日志'],['notifications','通知'],['stats','统计与规则分析']];const nav=node('nav',{'aria-label':'演示模块'},tabs.map(([key,label])=>button(label,async()=>{tab=key;await render();},key===tab?'active':'')));const content=node('section',{},node('p',{class:'muted'},'正在读取…'));app.replaceChildren(nav,content);try{if(user.role!=='admin'&&!people.length)people=(await api('/users?limit=100')).data.items;const view=await views[tab]();if(current===revision)content.replaceChildren(view);}catch(ex){if(current===revision)content.replaceChildren(node('div',{class:'notice error'},ex.message));}}
function cards(items,make){return items.length?node('div',{class:'grid'},items.map(make)):node('div',{class:'panel empty'},'当前范围没有记录。');}
function toolbar(title,...actions){return node('div',{class:'toolbar'},node('h2',{},title),node('div',{class:'actions'},actions));}
function taskCard(t){return node('article',{class:'card'},node('div',{class:'actions'},tag(t.executionState),tag(t.priority),t.frozen?tag('待审冻结'):null),node('h3',{style:'margin-top:15px'},t.title),node('p',{class:'muted'},'负责人：'+t.assigneeIds.map(username).join('、')),node('p',{class:'muted'},'截止：'+date(t.dueAt)),button('查看详情',()=>taskDetail(t.id)));}
async function taskDetail(id){const r=await api('/tasks/'+id),t=r.data;const area=node('section',{},node('p',{},t.description),node('h3',{style:'margin-top:20px'},'完成标准'),node('p',{},t.acceptanceCriteria),node('p',{class:'muted'},'负责人：'+t.assigneeIds.map(username).join('、')),node('p',{class:'muted'},'排期：'+date(t.startAt)+' — '+date(t.dueAt)),node('p',{},'当前进展：'+(t.progressNote||'暂无')));if(t.frozen)area.append(node('div',{class:'notice'},'当前有待审核申请，任务内容暂时冻结。'));const acts=node('div',{class:'actions',style:'margin-top:20px'});if(!t.frozen&&t.assigneeIds.includes(user.id)&&t.executionState!=='done'){acts.append(button('提交进展',()=>taskCommand(t,r.etag,'progress','进展说明','progressNote')),button('申请完成',()=>taskCommand(t,r.etag,'complete','完成说明','completionNote')));}if(!t.frozen&&t.originalCreatorId===user.id){if(t.executionState==='done')acts.append(button('申请重开',()=>taskCommand(t,r.etag,'reopen','重开原因','reason')));else acts.append(button('修改标题',()=>actionForm('修改任务标题',f=>{inputField(f,'任务名称','title','text',t.title);inputField(f,'修改原因','reason','textarea');},f=>api('/tasks/'+id,{method:'PATCH',etag:r.etag,body:{command:'change',title:f.get('title'),reason:f.get('reason')}}))));}area.append(acts,node('details',{},node('summary',{},'查看接口数据'),json(t)));showModal(t.title,area);}
function taskCommand(t,etag,command,label,field){actionForm(label,f=>inputField(f,label,field,'textarea'),f=>api('/tasks/'+t.id,{method:'PATCH',etag,body:{command,[field]:f.get(field)}}));}
function createTask(){actionForm('创建任务',f=>{inputField(f,'任务名称','title');inputField(f,'任务说明','description','textarea');inputField(f,'完成标准','acceptanceCriteria','textarea');f.append(node('label',{for:'owners'},'负责人（可多选；同级派发会由服务端拒绝）'));const select=node('select',{id:'owners',name:'assigneeIds',multiple:'',required:''},people.filter(p=>p.role!=='admin').map(p=>node('option',{value:p.id,...(p.id===user.id?{selected:''}:{})},p.displayName+' · '+(names[p.role]||p.role))));f.append(select);const day=new Date();day.setMinutes(day.getMinutes()-day.getTimezoneOffset());const today=day.toISOString().slice(0,10);inputField(f,'开始时间（本机时区）','startAt','datetime-local',today+'T09:00');inputField(f,'截止时间（本机时区）','dueAt','datetime-local',today+'T18:00');f.append(node('label',{for:'priority'},'紧急程度'),node('select',{name:'priority',id:'priority'},['urgent','high','medium','low'].map(v=>node('option',{value:v,...(v==='medium'?{selected:''}:{})},names[v]))));},f=>api('/tasks',{method:'POST',body:{title:f.get('title'),description:f.get('description'),acceptanceCriteria:f.get('acceptanceCriteria'),assigneeIds:f.getAll('assigneeIds'),priority:f.get('priority'),allDay:false,startAt:new Date(f.get('startAt')).toISOString(),dueAt:new Date(f.get('dueAt')).toISOString()}}));}
async function approvalDetail(id){const r=await api('/approval-requests/'+id),a=r.data,proposed=a.proposedVersion;const area=node('section',{},node('div',{class:'actions'},tag(a.kind),tag(a.status)),node('p',{},'申请人：'+username(a.applicantId)+'；审核人：'+username(a.currentReviewerId)),node('h3',{style:'margin-top:20px'},'拟生效内容'),node('p',{},proposed.description),node('p',{},'完成标准：'+proposed.acceptanceCriteria),node('p',{},'拟生效进展：'+(proposed.progressNote||'暂无')),node('p',{class:'muted'},'排期：'+date(proposed.startAt)+' — '+date(proposed.dueAt)));if(a.records?.length)area.append(node('h3',{style:'margin-top:20px'},'本次说明'),...a.records.map(x=>node('p',{},x.body)));const acts=node('div',{class:'actions',style:'margin-top:20px'});async function decide(decision,comment){await api('/approval-requests/'+id,{method:'PATCH',etag:r.etag,body:{decision,comment}});modal.close();message('申请已处理。');await render();}if(a.status==='pending'){if(a.currentReviewerId===user.id){acts.append(button('通过',async()=>{if(confirm('确认通过此申请并让内容生效？'))await decide('approve','演示页审核通过');},'primary'),button('退回',()=>actionForm('退回申请',f=>inputField(f,'退回原因','comment','textarea'),f=>api('/approval-requests/'+id,{method:'PATCH',etag:r.etag,body:{decision:'reject',comment:f.get('comment')}}))));}if(a.applicantId===user.id)acts.append(button('撤销我的申请',async()=>{if(confirm('确认撤销本次申请？'))await decide('withdraw','');}));}area.append(acts,node('details',{style:'margin-top:20px'},node('summary',{},'查看原值、拟改值与接口数据'),json(a)));showModal(proposed.title,area);}
function logForm(log,etag){actionForm(log?'编辑日志':'写日志',f=>{const today=new Date().toLocaleDateString('en-CA');inputField(f,'工作日期','businessDate','date',log?.businessDate||today);inputField(f,'日志正文','body','textarea',log?.body||'');},f=>api('/work-logs'+(log?'/'+log.id:''),{method:log?'PATCH':'POST',etag,body:{businessDate:f.get('businessDate'),body:f.get('body')}}));}
const views={
 async home(){const h=(await api('/home')).data;return node('section',{},toolbar('工作首页'),node('div',{class:'grid'},...['companyItems','personalItems','assignedTasks','recentLogs'].map((key,i)=>node('section',{class:'panel'},node('h3',{},['公司信息','个人信息','被派发待办','近十日日志'][i]),h[key].length?h[key].map(x=>node('div',{style:'margin:14px 0'},node('strong',{},x.title||x.businessDate),node('p',{},x.body||names[x.priority]||''))):node('p',{class:'muted'},'暂无内容')))));},
 async tasks(){const r=(await api('/tasks?limit=100')).data;return node('section',{},toolbar('任务 · '+r.total,button('刷新',render),button('创建任务',createTask,'primary')),node('p',{class:'muted',style:'margin-bottom:16px'},'仅展示当前有效任务，待创建审核请到申请页查看；每次加载最多100条。'),cards(r.items,taskCard));},
 async approvals(){const r=(await api('/approval-requests')).data;return node('section',{},toolbar('我的申请与待办',button('刷新',render)),cards(r.items,a=>node('article',{class:'card'},node('div',{class:'actions'},tag(a.kind),tag(a.status)),node('h3',{style:'margin-top:15px'},a.title),node('p',{class:'muted'},'申请人：'+username(a.applicantId)),node('p',{class:'muted'},'审核人：'+username(a.currentReviewerId)),button('查看与处理',()=>approvalDetail(a.id)))));},
 async logs(){const r=(await api('/work-logs?scope=visible&limit=100')).data;return node('section',{},toolbar('权限范围内工作日志',button('写日志',()=>logForm(null),'primary')),cards(r.items,l=>node('article',{class:'card'},node('h3',{},l.authorName+' · '+l.businessDate),node('p',{},l.body),l.editable?button('编辑',async()=>{const r=await api('/work-logs/'+l.id);logForm(r.data,r.etag);}):null)));},
 async notifications(){const r=(await api('/notifications?limit=100')).data;return node('section',{},toolbar('通知 · 未读 '+r.unreadCount,button('刷新',render)),node('p',{class:'muted',style:'margin-bottom:16px'},'消息已读或隐藏不会处理对应审批。事件分发与提醒可能延迟数秒。'),cards(r.items,n=>node('article',{class:'card'},tag(n.readAt?'已读':'未读'),node('p',{},n.summary),node('p',{class:'muted'},date(n.createdAt)),node('div',{class:'actions'},...['read','hide'].map(action=>button(action==='read'?'标记已读':'隐藏',async()=>{const detail=await api('/notifications/'+n.id);await api('/notifications/'+n.id,{method:'PATCH',etag:detail.etag,body:{action}});await render();}))))));},
 async stats(){const r=(await api('/analytics/task-summary')).data;const result=node('section',{},toolbar('有效任务统计',button('生成规则分析',async()=>{const created=(await api('/ai-jobs',{method:'POST',body:{scopeType:'visible'}})).data;const job=(await api('/ai-jobs/'+created.jobId)).data;showModal('规则分析 · 未连接模型',node('section',{},node('p',{},'结果来自当前可见任务，规则提示不会自动修改任务。'),job.result.suggestions.length?job.result.suggestions.map(x=>node('article',{class:'card'},node('h3',{},x.title),node('p',{},x.message))):node('p',{},'当前没有触发临期或逾期规则的任务。'),node('details',{},node('summary',{},'查看持久化作业数据'),json(job))));},'primary')),node('div',{class:'grid'},Object.entries({total:'全部',todo:'待开始',doing:'进行中',done:'已完成',frozen:'待审冻结',overdue:'已逾期'}).map(([k,v])=>node('div',{class:'panel'},node('p',{class:'muted'},v),node('div',{class:'count'},r[k])))),node('p',{class:'muted',style:'margin-top:18px'},'只统计当前用户可见的有效任务，同一任务计数一次。'));return result;},
 async admin(){const [u,t,a]=await Promise.all(['/admin/users?limit=100','/admin/teams?limit=100','/admin/audit-logs?limit=30'].map(p=>api(p)));return node('section',{},toolbar('后台只读查询',button('刷新',render)),node('div',{class:'notice'},'管理员使用独立管理接口；不因此获得普通任务审批或代写日志权限。'),node('section',{class:'panel'},node('h3',{},'组织与用户'),table(u.data.items,[['displayName','姓名'],['username','账号'],['role','角色'],['teamName','团队'],['active','启用']])),node('section',{class:'panel',style:'margin-top:18px'},node('h3',{},'最近操作历史'),table(a.data.items,[['createdAt','时间'],['actorName','操作人'],['action','事件'],['objectId','对象']])),node('details',{style:'margin-top:18px'},node('summary',{},'查看组织接口数据'),json(t.data)));}
};
function table(rows,cols){return node('div',{class:'tablewrap'},node('table',{},node('thead',{},node('tr',{},cols.map(c=>node('th',{},c[1])))),node('tbody',{},rows.map(r=>node('tr',{},cols.map(([k])=>node('td',{},k==='createdAt'?date(r[k]):names[r[k]]||String(r[k]??'—'))))))));}
login();
</script>
</body>
</html>
