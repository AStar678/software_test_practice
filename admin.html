<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>潘多拉 · 管理端</title>
<style>
  :root { color-scheme: light; --line:#dce5e5; --ink:#193130; --muted:#627674; --brand:#14766e; --danger:#b43232; --surface:#f4f7f8; }
  * { box-sizing: border-box; }
  [hidden] { display:none !important; }
  html { -webkit-text-size-adjust:100%; }
  body { margin:0; font-family:-apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; color:var(--ink); background:var(--surface); font-size:15px; line-height:1.6; overflow-wrap:anywhere; }
  button, input, select, textarea { font:inherit; color:inherit; }
  button { min-height:44px; touch-action:manipulation; }
  button:disabled { cursor:default; opacity:.5; }
  :focus-visible { outline:3px solid #69b9ad; outline-offset:3px; }
  header { background:#fff; border-bottom:1px solid var(--line); padding:16px max(24px, env(safe-area-inset-right)) 16px max(24px, env(safe-area-inset-left)); display:flex; align-items:center; gap:16px; }
  header h1 { font-size:19px; letter-spacing:-.5px; margin:0; }
  header .who { margin-left:auto; color:var(--muted); font-size:13px; }
  #scope { font-size:12px; }
  main { padding:24px max(20px, env(safe-area-inset-right)) calc(40px + env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left)); max-width:1240px; margin:0 auto; }
  nav { display:flex; gap:8px; flex-wrap:nowrap; overflow-x:auto; padding:3px 2px 10px; margin:0 -2px 14px; scrollbar-width:thin; overscroll-behavior-x:contain; }
  nav button { flex:0 0 auto; border:1px solid var(--line); background:#fff; border-radius:10px; padding:9px 16px; cursor:pointer; font-size:14px; white-space:nowrap; }
  nav button[aria-selected="true"] { background:var(--brand); border-color:var(--brand); color:#fff; }
  section { display:none; background:#fff; border:1px solid var(--line); border-radius:16px; padding:22px; min-width:0; overflow-x:auto; }
  section.active { display:block; }
  h2 { font-size:20px; margin:0 0 18px; letter-spacing:-.4px; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { text-align:left; padding:12px 9px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--muted); font-weight:500; white-space:nowrap; font-size:12px; }
  td:first-child { font-weight:600; }
  td .cell-value { min-width:0; }
  td[data-label="操作"] .cell-value { display:flex; flex-wrap:wrap; gap:6px; }
  input, select, textarea { font-size:16px; min-height:44px; min-width:0; max-width:100%; padding:9px 11px; border:1px solid #cbd8d6; border-radius:10px; background:#fff; }
  input::placeholder, textarea::placeholder { color:#788986; }
  button.primary { background:var(--brand); border:1px solid var(--brand); color:#fff; border-radius:10px; padding:9px 16px; cursor:pointer; font-size:14px; font-weight:600; }
  button.ghost { background:#fff; border:1px solid #cfddda; border-radius:10px; padding:9px 13px; cursor:pointer; font-size:14px; }
  button.primary:hover { background:#10665f; }
  button.ghost:hover { background:#edf5f3; }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:16px; }
  .row > input, .row > select { flex:1 1 180px; }
  .card { border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:12px; font-size:14px; background:#f8faf9; }
  #login { max-width:440px; margin:clamp(16px, 8vh, 90px) auto 0; padding:30px; background:#fff; }
  #login h2 { font-size:26px; margin-bottom:6px; }
  #login .row { display:grid; gap:12px; }
  #login .row input, #login .row button { width:100%; }
  #login .muted { font-size:13px; margin:0 0 22px; }
  #login .login-note { margin:16px 0 0; }
  .muted { color:var(--muted); }
  .error { color:var(--danger); font-size:14px; }
  .ok { color:#196c51; font-size:14px; }
  .error:not(:empty), .ok:not(:empty) { margin-top:12px; padding:12px; border-radius:10px; background:#fff0ee; }
  .ok:not(:empty) { background:#e8f4ee; }
  .secret { font-family:ui-monospace, Menlo, monospace; background:#fff7e6; border:1px dashed #d9a300; padding:8px; border-radius:6px; display:inline-block; max-width:100%; overflow-wrap:anywhere; }
  .tag { display:inline-block; background:#edf4f2; color:#3c6861; border-radius:5px; padding:2px 6px; margin:2px 4px 2px 0; font-size:12px; max-width:100%; overflow-wrap:anywhere; }
  dialog { border:1px solid var(--line); border-radius:18px; padding:24px; width:min(600px, calc(100vw - 24px)); max-width:calc(100vw - 24px); max-height:calc(100vh - 32px); max-height:calc(100dvh - 32px); overflow-y:auto; overscroll-behavior:contain; }
  dialog::backdrop { background:rgba(18,39,36,.48); }
  dialog input, dialog select, dialog textarea { width:100%; }
  dialog .row { margin-bottom:0; }
  #planReason { display:block; width:100%; resize:vertical; }
  #messageDialog { width:min(460px, calc(100vw - 24px)); }
  #messageDialog h2 { margin-bottom:12px; }
  #messageDialog[data-tone="error"] h2 { color:var(--danger); }
  .dialog-message { white-space:pre-wrap; margin:0; }
  .dialog-actions { display:flex; justify-content:flex-end; gap:10px; margin-top:24px; }
  #consoleOk:not(:empty) { position:fixed; right:20px; bottom:20px; z-index:10; max-width:min(440px, calc(100vw - 40px)); box-shadow:0 6px 24px #19313020; }
  label { display:block; font-size:13px; color:var(--muted); margin:12px 0 6px; }
  .grid2 { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:0 16px; }
  .grid2 > div { min-width:0; }
  @media(max-width:760px) {
    header { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:2px 12px; padding:14px max(16px, env(safe-area-inset-right)) 14px max(16px, env(safe-area-inset-left)); }
    header h1 { font-size:18px; }
    #scope, header .who { grid-column:1; margin:0; font-size:12px; }
    #scope:empty, header .who:empty { display:none; }
    #logout { grid-column:2; grid-row:1 / 4; align-self:center; }
    main { padding:16px max(12px, env(safe-area-inset-right)) calc(28px + env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left)); }
    section { padding:16px 12px; border-radius:14px; overflow:visible; }
    h2 { font-size:20px; }
    .row { gap:8px; }
    .row > input, .row > select { flex-basis:100%; width:100%; }
    .row > button { flex:1 1 auto; }
    nav { margin-bottom:10px; }
    table, tbody { display:block; }
    thead { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip-path:inset(50%); white-space:nowrap; }
    tbody { display:grid; gap:12px; }
    tbody tr { display:block; border:1px solid var(--line); border-radius:12px; overflow:hidden; background:#fff; }
    td { display:grid; grid-template-columns:76px minmax(0,1fr); gap:12px; padding:9px 12px; font-size:14px; border-bottom:0; }
    td::before { content:attr(data-label); color:var(--muted); font-weight:400; font-size:12px; padding-top:2px; }
    td:first-child { padding-top:12px; padding-bottom:10px; border-bottom:1px solid #edf2f1; margin-bottom:4px; }
    td:first-child .cell-value { font-size:16px; }
    td:last-child { padding-bottom:12px; }
    td[data-label="操作"] { border-top:1px solid #edf2f1; margin-top:4px; padding-top:12px; }
    td[data-label="操作"] .cell-value > select { flex-basis:100%; width:100%; }
    td[data-label="操作"] .cell-value > button { flex:1 1 auto; }
    .grid2 { grid-template-columns:minmax(0,1fr); }
    dialog { padding:20px 18px; }
    #login { margin-top:24px; padding:24px 20px; }
  }
  @media(prefers-reduced-motion:reduce) { *, *::before, *::after { scroll-behavior:auto !important; } }
</style>

<body class="pandora-admin">
<header>
  <h1>潘多拉 · 管理端</h1>
  <span class="muted" id="scope"></span>
  <span class="who" id="who"></span>
  <button class="ghost" id="logout">退出</button>
</header>
<main>
  <div id="login" class="card">
    <div class="row">
      <input id="accountName" placeholder="管理员账号" autocomplete="username">
      <input id="password" type="password" placeholder="密码" autocomplete="current-password">
      <button class="primary" id="loginButton">登录</button>
    </div>
    <div class="error" id="loginError"></div>
    <p class="muted">仅管理员账号可登录。</p>
  </div>

  <div id="console" hidden>
    <nav id="tabs"></nav>
    <div id="employeeSecret" class="card" role="status" aria-live="polite" hidden></div>

    <section id="tab-employees">
      <h2>员工</h2>
      <div class="row">
        <input id="employeeQuery" placeholder="搜索姓名/部门">
        <button class="ghost" id="employeeRefresh">刷新</button>
        <button class="primary" id="employeeNew">新增员工</button>
      </div>
      <table><thead><tr><th>姓名</th><th>登录手机号</th><th>入职日期</th><th>部门/职位</th><th>团队</th><th>直属上级</th><th>组织身份</th><th>状态</th><th></th></tr></thead>
        <tbody id="employeeRows"></tbody></table>
    </section>

    <section id="tab-organization">
      <h2>组织调整</h2>
      <div class="card"><strong>当前组织状态</strong><div id="health" role="status"></div></div>
      <p class="muted">未保存的调整仅保留在当前页面，刷新、关闭页面或退出登录后会丢失。</p>
      <div class="row"><button class="ghost" id="planReload">放弃未保存调整</button><button class="primary" id="planNewEmployee">添加新员工</button></div>
      <p id="planHint" class="ok" role="status"></p>
      <div class="card" id="planRemovals" hidden></div>
      <div class="card" id="planFounder" aria-label="公司创始人"></div>
      <div id="planUnits"></div>
      <h3>人员最终位置</h3><div id="planPeople"></div>
      <h3>停用与业务责任安排</h3><div id="planDepartures"></div>
      <label for="planReason">调整原因</label><textarea id="planReason" rows="2" maxlength="500" placeholder="说明本次完整调整的原因"></textarea>
      <div class="error" id="planError" role="alert"></div>
      <div class="row"><button class="primary" id="planSave">保存并生效</button></div>
    </section>
    <section id="tab-positions">
      <h2>展示职位</h2>
      <div class="row"><input id="positionName" placeholder="新职位名称"><button class="primary" id="positionCreate">新增职位</button></div>
      <table><thead><tr><th>职位</th><th>排序</th><th></th></tr></thead><tbody id="positionRows"></tbody></table>
    </section>
    <section id="tab-takeover">
      <h2>业务责任盘点与接管</h2>
      <div class="row"><select id="inventoryEmployee" aria-label="盘点员工"></select><button class="ghost" id="inventoryLoad">读取责任盘点</button></div>
      <div id="inventoryResult"></div><div class="error" id="inventoryError" role="alert"></div>
    </section>
    <section id="tab-account">
      <h2>管理员账号</h2>
      <div class="grid2"><div><label for="adminAccountName">账号名</label><input id="adminAccountName" autocomplete="username"></div>
        <div><label for="adminDisplayName">显示名称</label><input id="adminDisplayName"></div></div>
      <button class="primary" id="adminAccountSave">保存并重新登录</button>
      <h3>修改密码</h3><label for="adminCurrentPassword">当前密码</label><input id="adminCurrentPassword" type="password" autocomplete="current-password">
      <label for="adminNewPassword">新密码（至少10字符，含字母和数字，最多72字节）</label><input id="adminNewPassword" type="password" autocomplete="new-password">
      <button class="primary" id="adminPasswordSave">修改密码并重新登录</button><div class="error" id="adminAccountError" role="alert"></div>
    </section>

    <section id="tab-history">
      <h2>任务历史</h2>
      <div class="row">
        <input id="historyQuery" placeholder="搜索任务名称" aria-label="搜索任务名称">
        <select id="historyState" aria-label="任务状态">
          <option value="">全部状态</option><option value="todo">待办</option><option value="doing">进行中</option><option value="done">已完成</option>
        </select>
        <select id="historyRequest" aria-label="申请状态">
          <option value="">全部申请</option><option value="pending">待审核</option><option value="approved">已通过</option><option value="rejected">已拒绝</option><option value="withdrawn">已撤回</option><option value="direct">无需审核</option>
        </select>
        <button class="ghost" id="historySearch">查询</button>
        <button class="ghost" id="historyReset">清空条件</button>
      </div>
      <p class="muted" id="historyHint">按任务分页查找；打开任务查看完整变更记录。</p>
      <table><thead><tr><th>任务</th><th>状态</th><th>负责人（按顺序）</th><th>创建人</th><th>创建时间</th><th>申请</th><th></th></tr></thead><tbody id="historyRows"></tbody></table>
      <div class="row" id="historyPager"></div>
      <div id="historyDetail" hidden></div>
    </section>

    <section id="tab-notifications">
      <h2>通知管理</h2>
      <div class="row">
        <input id="notificationQuery" placeholder="筛选接收人、标题或摘要" aria-label="筛选通知">
        <select id="notificationState" aria-label="通知状态">
          <option value="">全部状态</option><option value="unread">未读</option><option value="read">已读</option><option value="withdrawn">已撤回</option><option value="expired">已过期</option><option value="hidden">已删除</option>
        </select>
        <button class="ghost" id="notificationRefresh">刷新</button>
      </div>
      <table><thead><tr><th>接收人</th><th>通知</th><th>状态</th><th>时间</th><th>到期</th><th></th></tr></thead><tbody id="notificationRows"></tbody></table>
      <div class="row" id="notificationPager"></div>
    </section>

    <section id="tab-company">
      <h2>公司信息</h2>
      <div class="row">
        <input id="offWorkTime" placeholder="HH:MM">
        <button class="primary" id="offWorkSave">保存下班时刻</button>
      </div>
      <div class="row"><input id="companyTitle" placeholder="标题（可空）"><input id="companyBody" placeholder="内容"><button class="primary" id="companyCreate">新增公司信息</button></div>
      <p class="muted" id="companyLimit"></p>
      <table><thead><tr><th>顺序</th><th>标题</th><th>内容</th><th></th></tr></thead><tbody id="companyRows"></tbody></table>
      <h3>节假日</h3>
      <form id="holidayRefreshForm" class="row">
        <label for="holidayYear">年份</label>
        <input id="holidayYear" type="number" min="1900" max="9999" step="1" required>
        <button class="primary" id="holidayRefresh" type="submit">刷新节假日</button>
      </form>
      <div id="holidayResult" role="status" aria-live="polite"></div>
    </section>

    <div class="ok" id="consoleOk" role="status"></div>
  </div>
</main>

<dialog id="employeeDialog">
  <h2 id="employeeDialogTitle">员工身份资料</h2><input type="hidden" id="employeeId">
  <label for="fDisplayName">姓名</label><input id="fDisplayName">
  <label for="fPhone">登录手机号</label><input id="fPhone" inputmode="tel" autocomplete="off">
  <label for="fHireDate">入职日期</label><input id="fHireDate" type="date">
  <div class="row"><button class="primary" id="employeeSave">保存</button><button class="ghost" id="employeeCancel">取消</button></div>
  <div class="error" id="employeeError" role="alert"></div>
</dialog>

<dialog id="messageDialog" aria-labelledby="messageTitle" aria-describedby="messageText">
  <form id="messageForm">
    <h2 id="messageTitle"></h2>
    <p id="messageText" class="dialog-message"></p>
    <div id="messageField" hidden>
      <label id="messageLabel" for="messageInput"></label>
      <input id="messageInput" autocomplete="off">
      <textarea id="messageTextarea" rows="4" hidden></textarea>
    </div>
    <p id="messageError" class="error" role="alert"></p>
    <div class="dialog-actions">
      <button type="button" class="ghost" id="messageCancel">取消</button>
      <button type="submit" class="primary" id="messageAccept">确定</button>
    </div>
  </form>
</dialog>

<script>
const state = { token: null, user: null, structure: null, employees: [], editing: null, transferring: null, history: { offset: 0, total: 0 }, notifications: { offset: 0, total: 0 }, tabs: [
  ['employees','员工'], ['organization','组织调整'], ['positions','展示职位'],
  ['takeover','停用与接管'], ['account','管理员账号'], ['company','公司信息'],
  ['history','任务历史'], ['notifications','通知管理']
] };

const $ = (id) => document.getElementById(id);
const esc = (value) => String(value == null ? '' : value).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

async function api(method, path, body, options = {}) {
  const headers = { 'Content-Type': 'application/json' };
  if (state.token) headers.Authorization = 'Bearer ' + state.token;
  if (options.key) headers['Idempotency-Key'] = options.key;
  if (options.ifMatch) headers['If-Match'] = options.ifMatch;
  const epoch=state.epoch||0,originTab=state.activeTab;
  try {
    const response = await fetch(path, { method, headers, body: body === undefined ? undefined : JSON.stringify(body) });
    const text = await response.text();
    const payload = text ? JSON.parse(text) : {};
    if(epoch!==(state.epoch||0))throw new Error('账号已切换，请重新读取');
    if (!response.ok) { const error = new Error(payload.message || ('请求失败 ' + response.status)); error.status = response.status; error.code = payload.code;error.details=payload; throw error; }
    return { body: payload, headers: response.headers };
  } catch(error) {error.epoch=epoch;error.originTab=originTab;throw error;}
}

const newKey = () => 'admin-' + Date.now() + '-' + Math.random().toString(36).slice(2, 10);
const messageQueue=[];
let activeMessage=null;
function showMessageDialog(options) {
  return new Promise(resolve=>{messageQueue.push({...options,resolve});openNextMessage();});
}
function openNextMessage() {
  if(activeMessage||!messageQueue.length)return;
  activeMessage=messageQueue.shift();
  const {title,message='',mode='notice',value='',multiline=false,confirmText='确定',tone=''}=activeMessage;
  $('messageDialog').dataset.tone=tone;
  $('messageTitle').textContent=title;
  $('messageText').textContent=message;$('messageText').hidden=!message;
  $('messageField').hidden=mode!=='input';
  $('messageInput').hidden=multiline;$('messageTextarea').hidden=!multiline;
  $('messageInput').value='';$('messageTextarea').value='';
  const field=multiline?$('messageTextarea'):$('messageInput');
  field.value=value;
  $('messageLabel').textContent=activeMessage.label||title;$('messageLabel').htmlFor=field.id;
  $('messageError').textContent='';
  $('messageAccept').textContent=confirmText;$('messageCancel').hidden=mode==='notice';
  $('messageDialog').showModal();
  if(mode==='input'){field.focus();field.select();}
  else (mode==='confirm'?$('messageCancel'):$('messageAccept')).focus();
}
function finishMessage(value) {
  if(!activeMessage)return;
  const completed=activeMessage;activeMessage=null;
  $('messageDialog').close();$('messageInput').value='';$('messageTextarea').value='';
  completed.resolve(value);queueMicrotask(openNextMessage);
}
function dismissMessages() {
  messageQueue.splice(0).forEach(message=>message.resolve(null));finishMessage(null);
}
$('messageForm').onsubmit=event=>{
  event.preventDefault();if(!activeMessage)return;
  if(activeMessage.mode==='input'){
    const field=activeMessage.multiline?$('messageTextarea'):$('messageInput'),value=field.value;
    if(activeMessage.required&&!value.trim()){$('messageError').textContent='请填写'+(activeMessage.label||activeMessage.title);field.focus();return;}
    finishMessage(value);
  }else finishMessage(true);
};
$('messageCancel').onclick=()=>finishMessage(null);
$('messageDialog').addEventListener('cancel',event=>{event.preventDefault();finishMessage(null);});
const askConfirmation=(message,options={})=>showMessageDialog({title:'确认操作',message,mode:'confirm',...options});
const askText=(title,value='',options={})=>showMessageDialog({title,value,mode:'input',...options});
const fail = (error) => {
  if(!error)return;
  if(typeof error==='object'&&((error.epoch!==undefined&&error.epoch!==(state.epoch||0))||(error.originTab&&error.originTab!==state.activeTab)))return;
  return showMessageDialog({title:'操作未完成',message:error.message||String(error),confirmText:'知道了',tone:'error'});
};
const ok = (message) => { clearTimeout(state.okTimer);$('consoleOk').textContent = message || '';if(message)state.okTimer=setTimeout(()=>ok(''),4000); };

function login() {
  $('loginError').textContent = '';
  fetch('/api/v1/auth/sessions', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ accountName: $('accountName').value.trim(), password: $('password').value, accountType: 'admin' })
  }).then(async (response) => {
    const payload = await response.json();
    if (!response.ok) { $('loginError').textContent = payload.message || '登录失败'; return; }
    state.epoch=(state.epoch||0)+1;state.planDraft=null;state.token = payload.token;
    state.user = payload.user;
    localStorage.setItem('pandora.admin.token', payload.token);
    enterConsole();
  });
}

function enterConsole() {
  $('login').hidden = true;
  $('console').hidden = false;
  $('who').textContent = (state.user.displayName || "管理员") + '（' + (state.user.role || '') + '）';
  renderTabs();
  if(state.user.mustChangePassword){selectTab('account',document.querySelector('[data-tab="account"]'));$('adminAccountSave').hidden=true;}else{$('adminAccountSave').hidden=false;reloadAll();}
}

function renderTabs() {
  const nav = $('tabs');
  nav.innerHTML = '';
  state.tabs.forEach(([id, label], index) => {
    const button = document.createElement('button');
    button.textContent = label;button.dataset.tab=id;
    button.setAttribute('aria-selected', index === 0 ? 'true' : 'false');
    button.onclick = () => selectTab(id, button);
    nav.appendChild(button);
  });
  selectTab('employees', nav.firstChild);
}

function selectTab(id, button) {
  dismissMessages();ok('');state.activeTab=id;
  document.querySelectorAll('nav button').forEach((b) => b.setAttribute('aria-selected', 'false'));
  if (button) button.setAttribute('aria-selected', 'true');
  document.querySelectorAll('section').forEach((s) => s.classList.remove('active'));
  $('tab-' + id).classList.add('active');
  if (id === 'history') loadHistory(0);
  if (id === 'notifications') loadNotifications(0);
  if (id === 'account') loadAdminAccount();
}

function options(select, items, { value = 'id', label = 'name', empty = null } = {}) {
  select.innerHTML = '';
  if (empty !== null) { const option = document.createElement('option'); option.value = ''; option.textContent = empty; select.appendChild(option); }
  items.forEach((item) => { const option = document.createElement('option'); option.value = item[value]; option.textContent = item[label]; select.appendChild(option); });
}

async function reorder(moveUpId) {
  const company = (await api('GET', '/api/v1/admin/company')).body;
  const ids = company.items.map((i) => i.id);
  const index = ids.indexOf(moveUpId);
  if (index <= 0) return;
  [ids[index - 1], ids[index]] = [ids[index], ids[index - 1]];
  try { await api('POST', '/api/v1/admin/company/items/reorder', { orderedIds: ids }, { key: newKey() }); ok('顺序已保存'); renderCompany(); }
  catch (error) { fail(error); }
}

function historySearchParams(offset) {
  const params = new URLSearchParams();
  params.set('limit', '20');
  params.set('offset', String(offset));
  const query = $('historyQuery').value.trim();
  if (query) params.set('q', query);
  if ($('historyState').value) params.set('state', $('historyState').value);
  if ($('historyRequest').value) params.set('requestStatus', $('historyRequest').value);
  return params.toString();
}

    state.history.total = result.total || 0;
    $('historyHint').textContent = `共 ${result.total || 0} 条任务，按创建时间倒序。当前显示第 ${result.items.length ? offset + 1 : 0}—${offset + result.items.length} 条。`;
    $('historyRows').innerHTML = result.items.map((task) => `<tr>

      <td>${esc((task.ownerNames || []).join(' → ') || '—')}</td>
      <td>${esc(task.creatorName || task.creatorId || '—')}</td>
      <td>${esc(formatTime(task.createdAt))}</td>
      <td>${esc(REQUEST_LABELS[task.latestRequestStatus] || task.latestRequestStatus || '—')}${task.pendingKind ? '<div class="muted">' + esc(KIND_LABELS[task.pendingKind] || task.pendingKind) + '待审</div>' : ''}</td>
      <td><button class="ghost" data-history-task="${esc(task.taskId)}">查看历史</button></td></tr>`).join('')

    document.querySelectorAll('[data-history-task]').forEach((button) => button.onclick = () => openTaskHistory(button.dataset.historyTask));
    const pages = Math.ceil((result.total || 0) / 20) || 1;
    const page = Math.floor(offset / 20) + 1;
    $('historyPager').innerHTML = `<button class="ghost" id="historyPrev" ${offset <= 0 ? 'disabled' : ''}>上一页</button>
      <span class="muted">第 ${page} / ${pages} 页</span>
      <button class="ghost" id="historyNext" ${result.nextOffset == null ? 'disabled' : ''}>下一页</button>`;
    $('historyPrev').onclick = () => loadHistory(Math.max(0, offset - 20));
    $('historyNext').onclick = () => { if (result.nextOffset != null) loadHistory(result.nextOffset); };
  } catch (error) { fail(error); }
}

function entryDetailText(entry, people) {
  const detail = entry.detail || {};
  switch (entry.entryType) {
    case 'request_decided':
      return `${KIND_LABELS[detail.kind] || detail.kind || '申请'} · ${REQUEST_LABELS[detail.status] || detail.status || ''}${detail.comment ? ' · 决定意见：' + detail.comment : ''}`;
    case 'no_reviewer':
      return entry.afterValue || detail.reason || detail.exemptionReason || '免审原因已记录';
    case 'reviewer_reassigned':
      return `${personName(people, entry.beforeValue)} → ${personName(people, entry.afterValue)}${detail.reason ? ' · ' + detail.reason : ''}`;
    case 'route_blocked':
      return detail.reason || '当前直属关系不可用，等待管理员修复';
    case 'handover':
    case 'handover_requested':
      return `${personName(people, detail.sourceUserId)} → ${personName(people, detail.targetUserId)}`;
    case 'reopen':
      return `第 ${entry.beforeValue} 轮 → 第 ${entry.afterValue} 轮${detail.reason ? ' · 原因：' + detail.reason : ''}`;
    case 'completion_returned':
      return detail.comment || '完成申请被退回，恢复进行中';
    case 'version_applied':
      return `${KIND_LABELS[detail.kind] || detail.kind || '版本'}生效${detail.executionState ? ' · ' + (STATE_LABELS[detail.executionState] || detail.executionState) : ''}`;
    default:
      return '';
  }
}

function entryValues(entry, people) {
  const detail = entry.detail || {};
  if (entry.entryType === 'assignee_order') {
    return {
      before: (detail.beforeOrder || []).map((id) => personName(people, id)).join(' → ') || '—',
      after: (detail.afterOrder || []).map((id) => personName(people, id)).join(' → ') || '—'
    };
  }
  if (entry.entryType === 'handover' || entry.entryType === 'handover_requested') {
    return { before: personName(people, detail.sourceUserId), after: personName(people, detail.targetUserId) };
  }
  if (entry.entryType === 'request_submitted') {
    return { before: '—', after: `${KIND_LABELS[detail.kind] || '申请'} · ${REQUEST_LABELS[detail.status] || ''}` };
  }
  if (entry.entryType === 'no_reviewer' || entry.entryType === 'route_blocked') {
    return { before: '需要审核', after: entry.afterValue || detail.reason || '免审' };
  }
  if (entry.entryType === 'request_decided') {
    return { before: '待审核', after: REQUEST_LABELS[entry.afterValue] || entry.afterValue || '—' };
  }
  const before = entry.entryType === 'reviewer_reassigned' ? personName(people, entry.beforeValue) : entry.beforeValue;
  const after = entry.entryType === 'reviewer_reassigned' ? personName(people, entry.afterValue) : entry.afterValue;
  return { before: before == null || before === '' ? '—' : String(before), after: after == null || after === '' ? '—' : String(after) };
}

async function openTaskHistory(taskId) {
  try {
    const history = (await api('GET', '/api/v1/admin/tasks/' + encodeURIComponent(taskId) + '/history')).body;
    const people = history.people || {};
    const exemptions = (history.entries || []).filter((entry) => entry.entryType === 'no_reviewer').map((entry) => entry.afterValue).filter(Boolean);
    const versions = (history.versions || []).map((version) => `<tr>
      <td>v${esc(version.versionNo)}</td><td>${esc(version.status)}</td><td>${esc(version.title || '—')}</td>
      <td>${esc((version.assigneeIds || []).map((id) => personName(people, id)).join(' → ') || '—')}</td>
      <td>${esc(version.allDay ? (version.startDate || '') + ' 至 ' + (version.dueDate || '') : formatTime(version.startAt) + ' — ' + formatTime(version.dueAt))}</td>
      <td>${esc(version.executionState || '—')}</td><td>${esc(formatTime(version.createdAt))}</td></tr>`).join('');
    const entries = (history.entries || []).map((entry) => {
      const values = entryValues(entry, people);
      const note = entryDetailText(entry, people);
      return `<tr>
        <td>${esc(formatTime(entry.occurredAt))}</td><td>${esc(entry.actorName || personName(people, entry.actorId))}</td>
        <td>${esc(ENTRY_LABELS[entry.entryType] || entry.entryType)}${entry.fieldName ? '<div class="muted">' + esc(FIELD_LABELS[entry.fieldName] || entry.fieldName) + '</div>' : ''}</td>
        <td>${esc(values.before)}</td><td>${esc(values.after)}</td><td>${esc(note)}</td></tr>`;
    }).join('');
    const reassignments = (history.reassignments || []).map((row) => `<tr>
      <td>${esc(formatTime(row.createdAt))}</td><td>${esc(personName(people, row.previousReviewerId))}</td>
      <td>${esc(personName(people, row.newReviewerId))}</td><td>${esc(row.reason || '—')}</td><td>${esc(row.source || '—')}</td></tr>`).join('');
    const transfers=(history.businessTransfers||[]).map(row=>`<tr><td>${esc(formatTime(row.occurredAt))}</td><td>${esc(personName(people,row.previousEmployeeId))}</td><td>${esc(personName(people,row.nextEmployeeId))}</td><td>${esc(row.administratorName||personName(people,row.administratorId))}</td><td>${esc(row.reason)}</td></tr>`).join('');
    const handovers = (history.handovers || []).map((row) => `<tr>
      <td>${esc(formatTime(row.createdAt))}</td><td>${esc(personName(people, row.sourceUserId))}</td>
      <td>${esc(personName(people, row.targetUserId))}</td><td>${esc(personName(people, row.setByUserId))}</td></tr>`).join('');
    $('historyDetail').hidden = false;
    $('historyDetail').innerHTML = `<div class="card"><div class="row" style="margin-bottom:8px">
        <h3 style="margin:0">任务 ${esc(taskId)}</h3>
        <span class="muted">创建人：${esc(history.originalCreatorName || history.originalCreatorId || '—')} · 状态：${esc(STATE_LABELS[history.executionState] || history.executionState || '—')} · 创建于 ${esc(formatTime(history.createdAt))}</span>
        <button class="ghost" id="historyClose">关闭</button></div>
      ${exemptions.length ? '<div class="card"><b>无需审核原因</b><div class="muted">' + exemptions.map(esc).join('<br>') + '</div></div>' : ''}
      <h3>版本与负责人顺序</h3>
      <table><thead><tr><th>版本</th><th>状态</th><th>标题</th><th>负责人（有序）</th><th>排期</th><th>执行状态</th><th>创建时间</th></tr></thead><tbody>${versions || '<tr><td colspan="7">暂无版本。</td></tr>'}</tbody></table>
      <h3 style="margin-top:18px">操作记录</h3>
      <table><thead><tr><th>时间</th><th>操作人</th><th>操作</th><th>前值</th><th>后值</th><th>说明</th></tr></thead><tbody>${entries || '<tr><td colspan="6">暂无操作记录。</td></tr>'}</tbody></table>
      <h3 style="margin-top:18px">改派（审核人变化）</h3>
      <table><thead><tr><th>时间</th><th>原审核人</th><th>新审核人</th><th>原因</th><th>来源</th></tr></thead><tbody>${reassignments || '<tr><td colspan="5">无改派记录。</td></tr>'}</tbody></table>
      <h3 style="margin-top:18px">正式业务接管</h3><table><thead><tr><th>时间</th><th>原责任方</th><th>接管人</th><th>管理员办理人</th><th>原因</th></tr></thead><tbody>${transfers||'<tr><td colspan="5">无接管记录。</td></tr>'}</tbody></table>
      <h3 style="margin-top:18px">交接</h3>
      <table><thead><tr><th>时间</th><th>原负责人</th><th>新负责人</th><th>经办人</th></tr></thead><tbody>${handovers || '<tr><td colspan="4">无交接记录。</td></tr>'}</tbody></table>
    </div>`;
    $('historyClose').onclick = () => { $('historyDetail').hidden = true; $('historyDetail').innerHTML = ''; };
    $('historyDetail').scrollIntoView({ block: 'nearest' });

function notificationStatus(row) {
  if (row.revokedAt) return '已撤回';
  if (row.hiddenAt) return '接收人已删除';
  if (row.expired) return '已过期';
  if (!row.deliveredAt) return '未送达';
  return row.readAt ? '已读' : '未读';
}

async function loadNotifications(offset) {
  state.notifications.offset = offset;
  try {
    const result = (await api('GET', '/api/v1/admin/notifications?limit=20&offset=' + offset)).body;
    state.notifications.total = result.total || 0;
    const query = $('notificationQuery').value.trim().toLowerCase();
    const wanted = $('notificationState').value;
    const rows = (result.items || []).filter((row) => {
      const status = notificationStatus(row);
      if (wanted && ((wanted === 'withdrawn' && status !== '已撤回') || (wanted === 'read' && status !== '已读')
        || (wanted === 'unread' && status !== '未读') || (wanted === 'expired' && status !== '已过期')
        || (wanted === 'hidden' && status !== '接收人已删除'))) return false;
      if (!query) return true;
      return [row.recipientName, row.title, row.summary, row.eventType].some((value) => String(value || '').toLowerCase().includes(query));
    });
    $('notificationRows').innerHTML = rows.map((row) => `<tr>
      <td>${esc(row.recipientName || row.recipientId)}</td>
      <td>${esc(row.title || row.summary || row.eventType || '—')}<div class="muted">${esc(row.eventType || '')}</div></td>
      <td>${esc(notificationStatus(row))}</td><td>${esc(formatTime(row.createdAt))}</td><td>${esc(formatTime(row.expiresAt))}</td>
      <td>${row.revokedAt || row.expired ? '' : `<button class="ghost" data-withdraw-event="${esc(row.eventId)}">撤回</button>`}</td></tr>`).join('')
      || '<tr><td colspan="6">没有符合条件的通知。</td></tr>';
    document.querySelectorAll('[data-withdraw-event]').forEach((button) => button.onclick = () => withdrawEvent(button.dataset.withdrawEvent));
    const pages = Math.ceil((result.total || 0) / 20) || 1;
    const page = Math.floor(offset / 20) + 1;
    $('notificationPager').innerHTML = `<button class="ghost" id="notificationPrev" ${offset <= 0 ? 'disabled' : ''}>上一页</button>
      <span class="muted">第 ${page} / ${pages} 页（共 ${result.total || 0} 条）</span>
      <button class="ghost" id="notificationNext" ${result.nextOffset == null ? 'disabled' : ''}>下一页</button>`;
    $('notificationPrev').onclick = () => loadNotifications(Math.max(0, offset - 20));
    $('notificationNext').onclick = () => { if (result.nextOffset != null) loadNotifications(result.nextOffset); };
  } catch (error) { fail(error); }
}

async function withdrawEvent(eventId) {
  const reason = await askText('撤回通知','',{label:'撤回原因',multiline:true,confirmText:'撤回'});
  if (reason === null) return;
  try {
    await api('POST', '/api/v1/admin/notifications/' + encodeURIComponent(eventId) + '/withdraw', { reason: reason.trim() || '管理员撤回' }, { key: newKey() });
    ok('通知已撤回：跳转与正文已移除，任务申请、业务结果和历史记录保持不变。');
    await loadNotifications(state.notifications.offset);
  } catch (error) { fail(error); }
}

async function saveEmployee() {

  try {
    if(!displayName)throw new Error('请填写姓名');

      const currentHire=detail.hireDate||'';

function resetPlan() {
  if(!state.structure)return;
  const source=state.structure;
  state.planVersion=source.rowVersion;
  state.planDraft={reason:'',departments:structuredClone(source.departments),teams:structuredClone(source.teams),
    placements:structuredClone(source.placements),expectedEmployees:structuredClone(source.expectedEmployees),
    newEmployees:[],businessTransfers:[],deactivateEmployees:[],cancelUnpublishedRequests:[]};
  // Invalid legacy mappings are deliberately presented as unfilled positions for controlled repair.
  source.employees.filter(e=>e.active&&!state.planDraft.placements.some(p=>p.employeeId===e.id)).forEach(e=>
    state.planDraft.placements.push({employeeId:e.id,placementType:e.id===source.organization.founderEmployeeId?'founder':'employee',departmentId:null,teamId:null,positionId:null}));
  state.planRemovedUnits=new Map();
  $('planReason').value='';$('planError').textContent='';$('planHint').textContent='';renderPlan();
}
function planSelect(items,value,label,attrs,empty='请选择') {

  if(value&&!items.some(i=>i.id===value))entries.push({id:value,name:'原归属已删除，请选择去向'});
  return `<select ${attrs}>${entries.map(i=>`<option value="${esc(i.id)}"${i.id===(value||'')?' selected':''}>${esc(i[label]||i.name)}</option>`).join('')}</select>`;
}

      <td>${esc(person?.displayName||'请在下方安排负责人')}</td><td><button class="ghost" data-remove-unit="${unit.id}" data-kind="${kind}">${state.structure[kind].some(u=>u.id===unit.id)?'标记删除':'取消新增'}</button></td></tr>`;

async function loadInventory() {
  $('inventoryError').textContent='';
  try {
    const employeeId=$('inventoryEmployee').value;
    const inv=(await api('GET','/api/v1/admin/employees/'+employeeId+'/responsibilities')).body;
    state.inventory=inv;
    const people=state.employees.filter(e=>e.active&&e.id!==employeeId);
    $('inventoryResult').innerHTML=`<p>未完成任务负责人交接 ${inv.unfinishedAssignments.length} 项：${inv.unfinishedAssignments.map(t=>esc(t.title)).join('、')||'无'}。请员工或其直属上级从员工端办理，所需审批须先通过。</p>
      <h3>已发布任务后续业务责任（含已完成）</h3>
      <table><thead><tr><th>任务</th><th>状态</th><th>业务接管人</th></tr></thead><tbody>${inv.businessTasks.map(t=>`<tr><td>${esc(t.title)}</td><td>${esc(STATE_LABELS[t.executionState]||t.executionState)}</td><td>${planSelect(people,null,'displayName',`data-takeover-task="${t.id}"`,'暂不接管')}</td></tr>`).join('')}</tbody></table>
      <h3>待审</h3>${inv.pendingRequests.map(r=>`<p>${esc(r.kind)} · ${esc(r.id)} ${r.kind==='create'&&r.applicantId===employeeId?`<label><input type="checkbox" data-cancel-request="${r.id}">停用时管理撤销此未发布创建</label>`:'须由业务方办结或按新责任方承接'}</p>`).join('')||'<p>无待审。</p>'}
      <label for="takeoverReason">接管/停用原因</label><input id="takeoverReason" placeholder="填写实际原因">
      <div class="row"><button class="primary" id="stageTakeover">将选定接管加入待保存调整</button>${inv.placement?.placementType!=='founder'?'<button class="ghost" id="stageDeactivate">准备停用，稍后统一保存</button>':''}</div>`;
    function stage(disable){
      const reason=$('takeoverReason').value.trim();if(!reason){$('inventoryError').textContent='请填写原因';return;}
      if(!state.planDraft)resetPlan();
      if(state.planVersion!==inv.rowVersion){$('inventoryError').textContent='组织版本已变化，请重新读取组织调整与责任盘点';return;}
      const draft=state.planDraft;
      document.querySelectorAll('[data-takeover-task]').forEach(select=>{
        if(!select.value)return;const task=inv.businessTasks.find(t=>t.id===select.dataset.takeoverTask);
        draft.businessTransfers=draft.businessTransfers.filter(t=>t.taskId!==task.id);
        draft.businessTransfers.push({taskId:task.id,taskVersion:task.rowVersion,ownerVersion:task.ownerVersion,previousEmployeeId:employeeId,nextEmployeeId:select.value,reason});
      });
      if(disable){
        const person=draft.expectedEmployees.find(e=>e.id===employeeId);
        draft.deactivateEmployees=draft.deactivateEmployees.filter(e=>e.employeeId!==employeeId);
        draft.deactivateEmployees.push({employeeId,rowVersion:person.rowVersion,reason});
        draft.placements=draft.placements.filter(p=>p.employeeId!==employeeId);
        document.querySelectorAll('[data-cancel-request]:checked').forEach(input=>{
          const request=inv.pendingRequests.find(r=>r.id===input.dataset.cancelRequest);
          draft.cancelUnpublishedRequests=draft.cancelUnpublishedRequests.filter(r=>r.requestId!==request.id);
          draft.cancelUnpublishedRequests.push({requestId:request.id,rowVersion:request.rowVersion,reason});
        });

      renderPlan();selectTab('organization',document.querySelector('[data-tab="organization"]'));$('planHint').textContent='接管或停用安排尚未生效。请安排全部人员去向，填写调整原因后点击“保存并生效”。';
    }
    $('stageTakeover').onclick=()=>stage(false);if($('stageDeactivate'))$('stageDeactivate').onclick=()=>stage(true);
  }catch(error){$('inventoryError').textContent=error.message;}
}

  state.epoch=(state.epoch||0)+1;state.token = null; state.user = null;state.planDraft=null;state.structure=null;state.employees=[];
  document.querySelectorAll('dialog[open]').forEach(d=>d.close());$('employeeSecret').textContent='';$('employeeSecret').hidden=true;$('scope').textContent='';$('inventoryResult').textContent='';$('historyDetail').textContent='';
  localStorage.removeItem('pandora.admin.token');
  $('console').hidden = true; $('login').hidden = false;
  $('password').value = '';
  $('holidayResult').textContent = '';
}

(async function boot() {
  const saved = localStorage.getItem('pandora.admin.token');
  if (!saved) return;
  try {
    // Verify the saved session first; the console is only entered for a real authenticated identity.
    const response = await fetch('/api/v1/auth/session', { headers: { Authorization: 'Bearer ' + saved } });
    if (!response.ok) { localStorage.removeItem('pandora.admin.token'); return; }
    const me = await response.json();
    state.token = saved;
    state.user = { displayName: me.displayName, accountType: me.accountType, role: me.role, mustChangePassword: me.mustChangePassword };
    enterConsole();
  } catch (error) { localStorage.removeItem('pandora.admin.token'); }
})();

// Adapt all current management tables without changing their data or actions.
(function labelManagementTables() {
  const observer = new MutationObserver(label);
  function label() {
    observer.disconnect();
    document.querySelectorAll('table').forEach(table => {
      table.setAttribute('role','table');
      const headings = Array.from(table.querySelectorAll('thead th'), heading => {
        heading.scope = 'col';
        heading.setAttribute('role','columnheader');
        if (!heading.textContent.trim()) heading.textContent = '操作';
        return heading.textContent.trim();
      });
      table.querySelectorAll('tbody tr').forEach(row => {
        row.setAttribute('role','row');
        Array.from(row.cells).forEach((cell,index) => {
          cell.setAttribute('role','cell');
          cell.dataset.label = headings[index] || '内容';
          if (cell.querySelector(':scope > .cell-value')) return;
          const value = document.createElement('div'); value.className = 'cell-value';
          value.append(...Array.from(cell.childNodes)); cell.appendChild(value);
        });
      });
    });
    observer.observe(document.body,{childList:true,subtree:true});
  }
  label();
})();
</script>
