<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>潘多拉 · 交互原型</title>
<style>
  :root{
    --bg:#eef1f6;
    --card:#ffffff;
    --ink:#1f2937;
    --ink-2:#374151;
    --muted:#6b7280;
    --line:#e3e7ee;
    --line-2:#f1f4f9;
    --brand:#2563eb;
    --brand-soft:#eaf0ff;
    --urgent:#c81e1e;
    --urgent-soft:#fdecec;
    --warn:#a16207;
    --warn-soft:#fdf6e3;
    --ok:#046c4e;
    --ok-soft:#e7f6f0;
    --grey-soft:#f3f4f6;
    --radius:12px;
    --shadow:0 10px 30px rgba(15,23,42,.14);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5;
    -webkit-font-smoothing:antialiased;
    /* 预览栏 + 手机框整体占满视口，手机框在剩余空间内自适应，导航始终可见 */
    display:flex;flex-direction:column;overflow:hidden;
  }
  button{font:inherit;color:inherit}
  :focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

  /* ---------- preview layer (not part of the product UI) ---------- */
  .preview-bar{
    display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;
    flex:0 0 auto;align-self:center;width:min(900px,calc(100% - 28px));margin:14px 0 10px;padding:10px 14px;
    background:#111827;color:#e5e7eb;border-radius:14px;
  }
  .preview-tag{font-size:11px;font-weight:700;letter-spacing:.06em;color:#93c5fd;text-transform:uppercase}
  .preview-note{font-size:12px;color:#9ca3af;flex:1 1 210px;min-width:0}
  .role-switch{display:flex;gap:6px}
  .role-switch button{
    border:1px solid #374151;background:#1f2937;color:#d1d5db;
    padding:6px 14px;border-radius:999px;cursor:pointer;font-size:13px;
  }
  .role-switch button[aria-pressed="true"]{background:#2563eb;border-color:#2563eb;color:#fff;font-weight:600}
  .role-switch button:hover{background:#374151}
  .role-switch button[aria-pressed="true"]:hover{background:#1d4ed8;border-color:#1d4ed8}

  /* ---------- phone stage ---------- */
  .stage{
    flex:1 1 auto;min-height:0;display:flex;justify-content:center;align-items:flex-start;
    padding:0 12px 18px;overflow:hidden;
  }
  .phone{
    width:390px;height:100%;max-height:844px;min-height:0;background:var(--card);border-radius:32px;
    border:1px solid #d5dae4;box-shadow:var(--shadow);
    overflow:hidden;display:flex;flex-direction:column;position:relative;
  }
  .app{flex:1;display:flex;flex-direction:column;min-height:0}

  .app-header{
    flex:0 0 auto;display:flex;align-items:center;gap:8px;
    padding:14px 14px 10px;border-bottom:1px solid var(--line-2);background:var(--card);
  }
  .app-header h1{margin:0;font-size:17px;font-weight:700;letter-spacing:.01em;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .app-header .who{font-size:11px;color:var(--muted);background:var(--grey-soft);border-radius:999px;padding:3px 8px;white-space:nowrap;max-width:44%;overflow:hidden;text-overflow:ellipsis}
  .bell{
    position:relative;width:34px;height:34px;border:1px solid var(--line);background:#fff;
    border-radius:10px;display:grid;place-items:center;cursor:pointer;flex:0 0 auto;
  }
  .bell:hover{background:var(--line-2)}
  .bell svg{width:18px;height:18px;stroke:var(--ink-2);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .bell .dot{
    position:absolute;top:-4px;right:-4px;min-width:17px;height:17px;padding:0 4px;
    border-radius:999px;background:var(--urgent);color:#fff;font-size:10px;font-weight:700;
    display:grid;place-items:center;border:2px solid #fff;
  }

  .app-main{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:12px 12px 16px;background:#fafbfd}
  .page{display:none;flex-direction:column;gap:12px}
  .page.is-active{display:flex}

  /* ---------- tab bar ---------- */
  .tabbar{
    flex:0 0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));
    border-top:1px solid var(--line);background:var(--card);padding:6px 4px 8px;
  }
  .tabbar button{
    border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;
    padding:5px 2px;border-radius:10px;cursor:pointer;color:var(--muted);font-size:11px;
  }
  .tabbar button svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .tabbar button[aria-selected="true"]{color:var(--brand);background:var(--brand-soft);font-weight:700}
  .tabbar button:hover{background:var(--line-2)}

  /* ---------- generic blocks ---------- */
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .card-head h2{margin:0;font-size:13px;font-weight:700;flex:1;min-width:0;overflow-wrap:anywhere}
  .card-head .hint{font-size:11px;color:var(--muted);font-weight:400;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .stack{display:flex;flex-direction:column;gap:10px}
  .row{display:flex;align-items:center;gap:8px}
  .row.wrap{flex-wrap:wrap}
  .spacer{flex:1}
  .muted{color:var(--muted)}
  .small{font-size:12px}
  .tiny{font-size:11px}
  .empty{color:var(--muted);font-size:12px;padding:10px 2px;text-align:center}

  .btn{
    border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 11px;
    cursor:pointer;font-size:12.5px;color:var(--ink-2);white-space:nowrap;
  }
  .btn:hover{background:var(--line-2)}
  .btn.primary{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
  .btn.primary:hover{background:#1d4ed8}
  .btn.danger{color:var(--urgent);border-color:#f0c2c2;background:#fff}
  .btn.danger:hover{background:var(--urgent-soft)}
  .btn.ok{color:var(--ok);border-color:#b7e0d0;background:#fff}
  .btn.ok:hover{background:var(--ok-soft)}
  .btn.tiny-btn{padding:4px 9px;font-size:11.5px;border-radius:7px}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .btn.ghost{border-color:transparent;background:transparent;color:var(--brand);padding:5px 6px}
  .btn.ghost:hover{background:var(--brand-soft)}

  /* ---------- badges ---------- */
  .badge{display:inline-flex;align-items:center;gap:3px;border-radius:999px;padding:2px 8px;font-size:11px;font-weight:600;border:1px solid transparent;white-space:nowrap}
  .b-urgent{background:var(--urgent-soft);color:var(--urgent);border-color:#f3c9c9}
  .b-high{background:var(--warn-soft);color:var(--warn);border-color:#efdfae}
  .b-normal{background:var(--grey-soft);color:var(--ink-2);border-color:var(--line)}
  .b-low{background:#f6f7f9;color:var(--muted);border-color:var(--line)}
  .b-ok{background:var(--ok-soft);color:var(--ok);border-color:#b7e0d0}
  .b-brand{background:var(--brand-soft);color:var(--brand);border-color:#c7d7fb}
  .b-pending{background:var(--warn-soft);color:var(--warn);border-color:#efdfae}
  .b-reject{background:var(--urgent-soft);color:var(--urgent);border-color:#f3c9c9}

  /* 我负责 / 我派发 : label + border style, never colour alone */
  .kind{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:6px}
  .kind.own{background:#eef2ff;color:#3730a3;border:1px solid #c7d2fe}
  .kind.assigned{background:#f0fdf4;color:#166534;border:1px dashed #86efac}
  .task-item{border:1px solid var(--line);border-radius:10px;padding:8px 9px;background:#fff;display:flex;flex-direction:column;gap:5px;cursor:pointer;text-align:left;width:100%;min-width:0;overflow:hidden}
  .task-item:hover{border-color:#c9d3e5;background:#fcfdff}
  .task-item.is-own{border-left:4px solid #4338ca}
  .task-item.is-assigned{border-left:4px dashed #16a34a}
  .task-item .t-title{font-size:12.5px;font-weight:600;line-height:1.35;display:flex;gap:6px;align-items:flex-start}
  .task-item .t-title span{flex:1;min-width:0}
  .task-meta{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:11px;color:var(--muted)}
  .task-item .t-note{font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .is-overdue{color:var(--urgent);font-weight:600}

  /* ---------- 导图 2x2 ---------- */
  .map-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:9px}
  .quad{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:9px;display:flex;flex-direction:column;min-height:0;min-width:0}
  .quad .card-head{margin-bottom:6px}
  .quad .card-head h2{font-size:12px;line-height:1.3}
  .quad .card-head{flex-wrap:wrap;gap:4px}
  .quad .card-head .hint{font-size:10.5px}
  .quad .q-body{overflow-y:auto;max-height:250px;display:flex;flex-direction:column;gap:6px}
  .item-line{border:1px solid var(--line-2);background:#fcfdff;border-radius:9px;padding:6px 8px;font-size:12px;display:flex;gap:6px;align-items:flex-start}
  .item-line .idx{font-weight:700;color:var(--brand);font-size:11px;min-width:14px}
  .item-line .txt{flex:1;min-width:0;overflow-wrap:anywhere}
  .log-line{border-left:3px solid var(--line);padding:2px 0 2px 8px;font-size:12px;cursor:pointer;text-align:left;background:none;border-top:0;border-right:0;border-bottom:0;width:100%}
  .log-line:hover{border-left-color:var(--brand);background:#fcfdff}
  .log-line .lt{font-size:10.5px;color:var(--muted);display:block}
  .log-line .lc{display:block;word-break:break-word}

  /* ---------- 视图 ---------- */
  .segmented{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;background:var(--grey-soft);border-radius:10px;padding:3px}
  .segmented button{border:0;background:none;padding:6px 0;border-radius:8px;cursor:pointer;font-size:12.5px;color:var(--ink-2)}
  .segmented button[aria-pressed="true"]{background:#fff;font-weight:700;color:var(--brand);box-shadow:0 1px 3px rgba(15,23,42,.12)}
  .legend{display:flex;flex-wrap:wrap;gap:10px;font-size:11px;color:var(--muted);align-items:center}
  .tl{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:#fff}
  .tl-monthwrap{min-width:734px}
  .tl-month{display:grid;grid-template-columns:repeat(7,104px);gap:1px;background:var(--line-2)}
  .tl-cell{background:#fff;min-height:74px;padding:4px;display:flex;flex-direction:column;gap:3px}
  .tl-cell.head{min-height:auto;background:#f7f9fc}
  .tl-cell .dnum{font-size:11px;font-weight:700;color:var(--ink-2);display:flex;gap:4px;align-items:center}
  .tl-cell.is-today{background:#f5f8ff}
  .tl-cell.is-today .dnum{color:var(--brand)}
  .tl-cell.is-out{background:#fbfbfd;color:#c3c8d2}
  .tl-week{display:grid;grid-auto-flow:column;grid-auto-columns:104px;min-width:100%}
  .tl-col{border-right:1px solid var(--line-2);padding:5px;display:flex;flex-direction:column;gap:4px}
  .tl-col:last-child{border-right:0}
  .tl-col .chead{font-size:11px;font-weight:700;color:var(--ink-2);background:#fff;padding-bottom:3px;border-bottom:1px solid var(--line-2)}
  .tl-slot{border-top:1px dashed var(--line);padding-top:3px;display:flex;flex-direction:column;gap:3px}
  .tl-slot .stime{font-size:10px;color:var(--muted)}
  .chip{border:1px solid var(--line);border-radius:7px;padding:3px 5px;font-size:11px;background:#fff;display:flex;flex-direction:column;gap:2px;cursor:pointer;text-align:left;width:100%}
  .chip:hover{background:#f7f9ff;border-color:#c9d3e5}
  .chip.is-own{border-left:3px solid #4338ca}
  .chip.is-assigned{border-left:3px dashed #16a34a}
  .chip .ct{font-weight:600;line-height:1.25;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .chip .cm{font-size:10px;color:var(--muted);display:flex;gap:4px;flex-wrap:wrap;align-items:center}
  .plusn{border:1px dashed var(--brand);background:var(--brand-soft);color:var(--brand);border-radius:7px;padding:2px 6px;font-size:11px;font-weight:700;cursor:pointer}

  /* ---------- log page ---------- */
  .log-card{border:1px solid var(--line);border-radius:10px;padding:9px 10px;background:#fff;display:flex;flex-direction:column;gap:6px}
  .log-card header{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);flex-wrap:wrap}
  .log-card .who{font-weight:700;color:var(--ink-2);font-size:12px}
  .log-card p{margin:0;font-size:12.5px;word-break:break-word}
  .log-link{align-self:flex-start}

  .action-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .action-grid .btn{width:100%;min-width:0;display:flex;align-items:center;justify-content:center;gap:5px;padding:10px 8px;font-size:12.5px;white-space:normal;text-align:center}
  .action-grid .btn.wide{grid-column:1 / -1}
  .count-pill{background:var(--urgent);color:#fff;border-radius:999px;font-size:10px;padding:1px 6px;font-weight:700}

  /* ---------- AI map ---------- */
  .stat-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .stat{background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 6px;text-align:center}
  .stat .v{font-size:19px;font-weight:700;color:var(--brand);line-height:1.2}
  .stat .k{font-size:10.5px;color:var(--muted);margin-top:2px}
  .wc{display:flex;flex-wrap:wrap;gap:7px 9px;align-items:baseline;justify-content:center;padding:6px 0}
  .wc span{line-height:1.15}
  .advice{border-left:3px solid var(--brand);background:#f7f9ff;border-radius:0 9px 9px 0;padding:8px 10px;font-size:12.5px}
  .advice + .advice{margin-top:8px}

  /* ---------- profile ---------- */
  .profile-card{display:flex;flex-direction:column;gap:0;padding:0;overflow:hidden}
  .profile-row{display:flex;align-items:center;gap:10px;padding:13px 14px;border-bottom:1px solid var(--line-2)}
  .profile-row:last-child{border-bottom:0}
  .profile-row .k{width:56px;color:var(--muted);font-size:12.5px;flex:0 0 auto}
  .profile-row .v{font-size:14px;font-weight:600}
  .avatar{width:48px;height:48px;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-size:18px;font-weight:700}

  /* ---------- overlay / sheet ---------- */
  .overlay{position:absolute;inset:0;background:rgba(15,23,42,.42);display:flex;align-items:flex-end;z-index:40}
  .overlay[hidden]{display:none}
  .sheet{
    width:100%;max-height:88%;background:#fff;border-radius:18px 18px 0 0;
    display:flex;flex-direction:column;min-height:0;box-shadow:0 -8px 24px rgba(15,23,42,.18);
  }
  .sheet-head{flex:0 0 auto;display:flex;align-items:flex-start;gap:8px;padding:14px 14px 10px;border-bottom:1px solid var(--line-2)}
  .sheet-head h2{margin:0;font-size:15px;font-weight:700;flex:1;min-width:0;word-break:break-word}
  .sheet-body{flex:1;min-height:0;overflow-y:auto;padding:12px 14px 14px;display:flex;flex-direction:column;gap:12px}
  .sheet-foot{flex:0 0 auto;display:flex;gap:8px;padding:10px 14px 14px;border-top:1px solid var(--line-2)}
  .sheet-foot .btn{flex:1;min-width:0;padding:10px;text-align:center;justify-content:center;white-space:normal}
  .icon-close{border:1px solid var(--line);background:#fff;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;cursor:pointer;flex:0 0 auto;line-height:1}
  .icon-close:hover{background:var(--line-2)}

  .field{display:flex;flex-direction:column;gap:4px}
  .field > label{font-size:11.5px;font-weight:600;color:var(--ink-2)}
  .field input[type="text"],.field input[type="date"],.field input[type="time"],.field input[type="number"],.field select,.field textarea{
    border:1px solid var(--line);border-radius:9px;padding:8px 9px;font:inherit;font-size:13px;background:#fff;color:var(--ink);width:100%;
  }
  .field textarea{min-height:78px;resize:vertical}
  .choice-row{display:flex;flex-wrap:wrap;gap:6px}
  .choice{border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:12px;background:#fff;cursor:pointer}
  .choice[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
  .checkline{display:flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:9px;padding:7px 9px;font-size:12.5px;cursor:pointer}
  .checkline input{width:15px;height:15px}
  .checkline .meta{margin-left:auto;font-size:11px;color:var(--muted)}
  .kv{display:grid;grid-template-columns:76px minmax(0,1fr);gap:6px 8px;font-size:12.5px}
  .kv .k{color:var(--muted)}
  .kv .v{overflow-wrap:anywhere;min-width:0}
  .divider{height:1px;background:var(--line-2);margin:2px 0}
  .callout{background:var(--warn-soft);border:1px solid #efdfae;border-radius:9px;padding:8px 10px;font-size:12px;color:#7c4a03}
  .callout.info{background:var(--brand-soft);border-color:#c7d7fb;color:#1e3a8a}
  .callout.reject{background:var(--urgent-soft);border-color:#f3c9c9;color:#8f1d1d}
  .progress-track{height:8px;border-radius:999px;background:var(--grey-soft);overflow:hidden;border:1px solid var(--line)}
  .progress-track > i{display:block;height:100%;background:var(--brand)}
  .child-task{border:1px solid var(--line);border-radius:9px;padding:7px 9px;display:flex;flex-direction:column;gap:4px;background:#fcfdff;cursor:pointer;text-align:left;width:100%}
  .child-task:hover{border-color:#c9d3e5}
  .notif{display:flex;gap:9px;padding:9px 4px;border-bottom:1px solid var(--line-2);cursor:pointer;text-align:left;background:none;border-left:0;border-right:0;border-top:0;width:100%}
  .notif:last-child{border-bottom:0}
  .notif:hover{background:#fcfdff}
  .notif .nbody{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
  .notif .ntitle{font-size:12.5px;font-weight:600}
  .notif .nmeta{font-size:11px;color:var(--muted)}
  .notif .ndot{width:8px;height:8px;border-radius:50%;background:var(--brand);margin-top:6px;flex:0 0 auto}
  .notif.is-read .ntitle{font-weight:500;color:var(--ink-2)}
  .notif.is-read .ndot{background:transparent}

  @media (max-width:900px){
    .preview-bar{margin:10px 10px 8px}
  }
  @media (max-width:480px){
    body{background:#fff}
    .preview-bar{align-self:stretch;width:auto;margin:8px 8px 6px;padding:8px 10px;border-radius:12px;gap:6px 10px}
    .preview-note{flex:1 1 150px;font-size:11px}
    .role-switch button{padding:5px 12px;font-size:12.5px}
    .stage{padding:0}
    .phone{width:100%;max-height:none;border-radius:0;border:0;box-shadow:none}
  }
</style>
</head>
<body>

<div class="preview-bar">
  <span class="preview-tag">原型预览</span>
  <span class="preview-note">身份切换仅用于演示分级权限，不属于产品功能。</span>
  <div class="role-switch" id="roleSwitch" role="group" aria-label="预览身份">
    <button type="button" data-role="upper" aria-pressed="false">上层</button>
    <button type="button" data-role="middle" aria-pressed="false">中层</button>
    <button type="button" data-role="lower" aria-pressed="false">下层</button>
  </div>
</div>

<div class="stage">
  <div class="phone">
    <div class="app">
      <header class="app-header">
        <h1 id="pageTitle">导图</h1>
        <span class="who" id="whoami">—</span>
        <button class="bell" id="bellBtn" type="button" aria-label="通知">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
          <span class="dot" id="bellDot" hidden></span>
        </button>
      </header>

      <main class="app-main" id="appMain">
        <section class="page is-active" id="page-map" aria-labelledby="pageTitle"></section>
        <section class="page" id="page-view" aria-labelledby="pageTitle"></section>

const DAY = 24 * 60 * 60 * 1000;
const LOAD_AT = new Date();
const BASE_DAY = new Date(LOAD_AT.getFullYear(), LOAD_AT.getMonth(), LOAD_AT.getDate());

function at(dayOffset, hour, minute){
  return new Date(BASE_DAY.getFullYear(), BASE_DAY.getMonth(), BASE_DAY.getDate() + dayOffset, hour, minute || 0, 0, 0);
}
function pad2(n){ return n < 10 ? "0" + n : "" + n; }
function startOfDay(d){ return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
function sameDay(a, b){ return startOfDay(a).getTime() === startOfDay(b).getTime(); }
function dayDiff(a, b){ return Math.round((startOfDay(a) - startOfDay(b)) / DAY); }
function fmtDate(d){ return (d.getMonth() + 1) + "月" + d.getDate() + "日"; }
function fmtDateTime(d){ return fmtDate(d) + " " + pad2(d.getHours()) + ":" + pad2(d.getMinutes()); }
function fmtTime(d){ return pad2(d.getHours()) + ":" + pad2(d.getMinutes()); }
function relativeDayLabel(d){
  const diff = dayDiff(d, BASE_DAY);
  if (diff === 0) return "今天";
  if (diff === 1) return "明天";
  if (diff === -1) return "昨天";
  if (diff === 2) return "后天";
  return diff > 0 ? diff + "天后" : Math.abs(diff) + "天前";
}
function fmtDue(d){
  const diff = dayDiff(d, BASE_DAY);
  if (diff === 0) return "今天 " + fmtTime(d) + " 截止";
  if (diff === 1) return "明天 " + fmtTime(d) + " 截止";
  if (diff === -1) return "昨天 " + fmtTime(d) + " 截止";
  return fmtDate(d) + " " + fmtTime(d) + " 截止";
}
function isOverdue(t){
  return t.type === "normal" && t.status !== "done" && t.status !== "rejected" && t.due.getTime() < LOAD_AT.getTime();
}
function toDateInput(d){ return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate()); }
function toTimeInput(d){ return pad2(d.getHours()) + ":" + pad2(d.getMinutes()); }
function esc(s){
  return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}

/* =====================================================================
   权限与业务规则：所有页面、详情与表单统一复用这里的派生函数。
   说明：这是交互原型中的演示规则，不构成真实客户端安全边界。
   ===================================================================== */
function personById(id){ return PEOPLE.find(function(p){ return p.id === id; }) || null; }
function actor(){ return personById(state.actorId); }
function deptOf(pid){ const p = personById(pid); return p ? p.dept : ""; }
function directSuperiorOf(pid){
  const p = personById(pid);
  return p && p.superiorId ? personById(p.superiorId) : null;
}
function taskById(id){ return TASKS.find(function(t){ return t.id === id; }) || null; }
function logById(id){ return LOGS.find(function(l){ return l.id === id; }) || null; }
function childrenOf(id){
  return TASKS.filter(function(t){ return t.parentId === id; });
}
function assigneesOf(t){ return t.assigneeIds.map(personById).filter(Boolean); }
function creatorOf(t){ return personById(t.creatorId); }

/* 任务是否落在某个部门范围内：创建者或任一负责人属于该部门 */
function taskInDept(t, dept){
  const ids = [t.creatorId].concat(t.assigneeIds);
  return ids.some(function(id){ return deptOf(id) === dept; });
}
function taskHasMember(t, pid){
  return t.creatorId === pid || t.assigneeIds.indexOf(pid) !== -1;
}

/* 角色可见范围 */
function visibleTasks(a){
  if (a.role === "upper") return TASKS.slice();
  if (a.role === "middle") return TASKS.filter(function(t){ return taskInDept(t, a.dept); });
  return TASKS.filter(function(t){ return taskHasMember(t, a.id); });
}
function visibleLogs(a){
  if (a.role === "upper") return LOGS.slice();
  if (a.role === "middle") return LOGS.filter(function(l){ return deptOf(l.authorId) === a.dept; });
  return LOGS.filter(function(l){ return l.authorId === a.id; });
}
/* 可派发/可选择的负责人范围 */
function assignablePeople(a){
  if (a.role === "upper") return PEOPLE.slice();
  if (a.role === "middle"){
    return PEOPLE.filter(function(p){ return p.id === a.id || (p.dept === a.dept && p.role === "lower"); });
  }
  return [a];
}
/* 可见的上级任务候选（仅普通任务，且在当前身份可见范围内） */
/* 可选上级任务：范围内任务均可作为上级，抽象任务也可作为普通子任务的上级。
   排除自身与其直接子任务，避免自引用和一层父子结构下的环。 */
function parentCandidates(a, forTask){
  return sortTasks(visibleTasks(a).filter(function(t){
    if (forTask && (t.id === forTask.id || t.parentId === forTask.id)) return false;
    return true;
  }));
}

/* 编辑 / 进度 / 审核规则 */
function canEditTask(a, t){ return !!t && t.creatorId === a.id && t.status !== "rejected"; }
function canUpdateProgress(a, t){
  if (!t || t.type !== "normal") return false;
  if (t.assigneeIds.indexOf(a.id) === -1) return false;
  /* 待审核任务尚未生效，不能更新进度或提交完成 */
  return t.status === "todo" || t.status === "doing";
}
/* 完成审核人：派发任务由创建者审核，自建任务由直属上级审核 */
function completionReviewer(t){
  if (t.selfCreated){
    const sup = directSuperiorOf(t.creatorId);
    return sup && sup.id !== t.creatorId ? sup : null;
  }
  return personById(t.creatorId);
}
/* 创建审核人：自建任务的直属上级；上层无上级则无需审核 */
function createReviewer(t){
  if (!t.selfCreated) return null;
  return directSuperiorOf(t.creatorId);
}
function isFinished(t){ return t.status === "done" || t.status === "rejected"; }
function pendingCreateFor(a){
  return sortTasks(visibleTasks(a).filter(function(t){
    if (t.status !== "pending-create") return false;
    const r = createReviewer(t);
    return !!r && r.id === a.id;
  }));
}
function pendingCompleteFor(a){
  return sortTasks(visibleTasks(a).filter(function(t){
    if (t.status !== "pending-complete") return false;
    const r = completionReviewer(t);
    return !!r && r.id === a.id;
  }));
}
function pendingReviewCount(a){ return pendingCreateFor(a).length + pendingCompleteFor(a).length; }

/* 抽象任务：由普通子任务汇总 */
function abstractStats(t){
  const kids = childrenOf(t.id);
  const total = kids.length;
  const done = kids.filter(function(k){ return k.status === "done"; }).length;
  return { kids: kids, total: total, done: done, pct: total ? Math.round(done / total * 100) : 0 };
}
function effectiveStatus(t){
  if (t.type !== "abstract") return t.status;
  const s = abstractStats(t);
  if (s.total && s.done === s.total) return "done";
  if (s.kids.some(function(k){ return k.status === "doing" || k.status === "pending-complete"; })) return "doing";
  return "todo";
}
function effectiveProgress(t){
  if (t.type !== "abstract") return t.progress;
  return abstractStats(t).pct;
}
/* 排序：紧急程度优先，其次距截止时间更近的优先 */
function sortTasks(list){
  return list.slice().sort(function(x, y){
    const ux = URGENCY_ORDER[x.urgency], uy = URGENCY_ORDER[y.urgency];
    if (ux !== uy) return ux - uy;
    return x.due.getTime() - y.due.getTime();
  });
}
/* 当前身份在某任务中的角色：own 我负责 / assigned 我派发 / other */
function taskKind(t, a){
  if (t.assigneeIds.indexOf(a.id) !== -1) return "own";
  if (t.creatorId === a.id) return "assigned";
  return "other";
}
const KIND_LABEL = { own: "我负责", assigned: "我派发", other: "范围内" };

/* 通知与请示 */
function notificationsFor(a){
  return NOTIFICATIONS
    .filter(function(n){ return n.recipients.indexOf(a.id) !== -1 && taskById(n.taskId); })
    .sort(function(x, y){ return y.time.getTime() - x.time.getTime(); });
}
function unreadCount(a){
  return notificationsFor(a).filter(function(n){ return n.read.indexOf(a.id) === -1; }).length;
}
function inboxConsultations(a){
  return CONSULTATIONS.filter(function(c){ return c.toId === a.id; })
    .sort(function(x, y){ return y.time.getTime() - x.time.getTime(); });
}
function sentConsultations(a){
  return CONSULTATIONS.filter(function(c){ return c.fromId === a.id; })
    .sort(function(x, y){ return y.time.getTime() - x.time.getTime(); });
}

/* ------------------------------ 通用渲染片段 ------------------------------ */
function kindTag(t, a){
  const k = taskKind(t, a);
  if (k === "other") return "";
  return '<span class="kind ' + k + '">' + KIND_LABEL[k] + "</span>";
}
function statusBadge(t){
  const st = effectiveStatus(t);
  return '<span class="badge ' + STATUS_CLASS[st] + '">' + STATUS_LABEL[st] + "</span>";
}
function urgencyBadge(u){
  return '<span class="badge ' + urgencyClass(u) + '">' + esc(u) + "</span>";
}
function typeBadge(t){
  return t.type === "abstract" ? '<span class="badge b-pending">抽象任务</span>' : "";
}
function taskItemHTML(t, a, opts){
  opts = opts || {};
  const k = taskKind(t, a);
  const cls = k === "own" ? "is-own" : k === "assigned" ? "is-assigned" : "";
  const overdue = isOverdue(t);
  const note = t.progressNote ? '<div class="t-note">进度备注：' + esc(t.progressNote) + "</div>" : "";
  const pct = effectiveProgress(t);
  return '<button type="button" class="task-item ' + cls + '" data-task="' + t.id + '">' +
      '<span class="t-title"><span>' + esc(t.title) + "</span></span>" +
      '<span class="task-meta">' + kindTag(t, a) + typeBadge(t) + statusBadge(t) + urgencyBadge(t.urgency) +
        '<span class="' + (overdue ? "is-overdue" : "") + '">' + esc(fmtDue(t.due)) + (overdue ? " · 已逾期" : "") + "</span>" +
        (opts.hideProgress ? "" : "<span>进度 " + pct + "%</span>") +
      "</span>" + note +
    "</button>";
}

/* ============================== 页面：视图 ============================== */
const WEEK_NAMES = ["周一", "周二", "周三", "周四", "周五", "周六", "周日"];
const overflowGroups = {};

function registerOverflow(title, tasks){
  const id = "ov" + (Object.keys(overflowGroups).length + 1) + "-" + Math.random().toString(36).slice(2, 6);
  overflowGroups[id] = { title: title, ids: tasks.map(function(t){ return t.id; }) };
  return id;
}
function chipHTML(t, a){
  const k = taskKind(t, a);
  const cls = k === "own" ? "is-own" : k === "assigned" ? "is-assigned" : "";
  return '<button type="button" class="chip ' + cls + '" data-task="' + t.id + '">' +
      '<span class="ct">' + esc(t.title) + "</span>" +
      '<span class="cm">' + kindTag(t, a) + urgencyBadge(t.urgency) +
        '<span>' + esc(fmtTime(t.due)) + "</span></span>" +
    "</button>";
}
const CELL_CAPACITY = 2;
function cellHTML(tasks, a, label, title){
  const shown = tasks.slice(0, CELL_CAPACITY);
  const hidden = tasks.slice(CELL_CAPACITY);
  let html = shown.map(function(t){ return chipHTML(t, a); }).join("");
  if (hidden.length){
    const gid = registerOverflow(title + " 其余 " + hidden.length + " 项", hidden);
    html += '<button type="button" class="plusn" data-overflow="' + gid + '" aria-label="' +
      esc(title + "还有 " + hidden.length + " 项，点击查看") + '">+' + hidden.length + "</button>";
  }
  if (!tasks.length) html = '<span class="tiny muted">' + esc(label) + "</span>";
  return html;
}
function viewTasks(a){
  return sortTasks(visibleTasks(a).filter(function(t){ return t.status !== "rejected"; }));
}
function tasksOnDay(list, d){
  return list.filter(function(t){ return sameDay(t.due, d); });
}
function renderView(){
  const a = actor();
  const el = document.getElementById("page-view");
  const list = viewTasks(a);
  const anchor = state.viewAnchor;
  let body = "";
  let rangeLabel = "";

  if (state.viewMode === "month"){
    const y = anchor.getFullYear(), m = anchor.getMonth();
    const first = new Date(y, m, 1);
    const offset = (first.getDay() + 6) % 7;
    const daysInMonth = new Date(y, m + 1, 0).getDate();
    const start = new Date(y, m, 1 - offset);
    const total = Math.ceil((offset + daysInMonth) / 7) * 7;
    rangeLabel = y + "年" + (m + 1) + "月（精确到天）";
    let cells = "";
    for (let i = 0; i < total; i++){
      const d = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i);
      const dayTasks = tasksOnDay(list, d);
      const isOut = d.getMonth() !== m;
      cells += '<div class="tl-cell' + (sameDay(d, BASE_DAY) ? " is-today" : "") + (isOut ? " is-out" : "") + '">' +
        '<div class="dnum">' + d.getDate() + (sameDay(d, BASE_DAY) ? '<span class="tiny">今天</span>' : "") +
          (dayTasks.length ? '<span class="tiny muted">' + dayTasks.length + "项</span>" : "") + "</div>" +
        cellHTML(dayTasks, a, "无任务", fmtDate(d)) +
      "</div>";
    }
    body = '<div class="tl"><div class="tl-monthwrap">' +
      '<div class="tl-month">' +
        WEEK_NAMES.map(function(w){ return '<div class="tl-cell head"><div class="dnum">' + w + "</div></div>"; }).join("") +
      "</div>" +
      '<div class="tl-month">' + cells + "</div></div></div>";
  } else if (state.viewMode === "week"){
    const offset = (anchor.getDay() + 6) % 7;
    const monday = new Date(anchor.getFullYear(), anchor.getMonth(), anchor.getDate() - offset);
    rangeLabel = fmtDate(monday) + " - " + fmtDate(new Date(monday.getFullYear(), monday.getMonth(), monday.getDate() + 6)) + "（精确到时刻）";
    let cols = "";
    for (let i = 0; i < 7; i++){
      const d = new Date(monday.getFullYear(), monday.getMonth(), monday.getDate() + i);
      const dayTasks = tasksOnDay(list, d);
      const hours = [];
      dayTasks.forEach(function(t){ if (hours.indexOf(t.due.getHours()) === -1) hours.push(t.due.getHours()); });
      hours.sort(function(x, y){ return x - y; });
      const slots = hours.map(function(h){
        const inHour = dayTasks.filter(function(t){ return t.due.getHours() === h; });
        return '<div class="tl-slot"><span class="stime">' + pad2(h) + ":00</span>" +
          cellHTML(inHour, a, "—", fmtDate(d) + " " + pad2(h) + ":00") + "</div>";
      }).join("");
      cols += '<div class="tl-col"><div class="chead">' + WEEK_NAMES[i] + " " + (d.getMonth() + 1) + "/" + d.getDate() +
        (sameDay(d, BASE_DAY) ? " · 今天" : "") + '<span class="tiny muted"> ' + dayTasks.length + "项</span></div>" +
        (dayTasks.length ? slots : '<span class="tiny muted">无任务</span>') + "</div>";
    }
    body = '<div class="tl"><div class="tl-week">' + cols + "</div></div>";
  } else {
    const d = anchor;
    rangeLabel = fmtDate(d) + " " + WEEK_NAMES[(d.getDay() + 6) % 7] + "（精确到时刻）";
    const dayTasks = tasksOnDay(list, d);
    const hours = [];
    for (let h = 8; h <= 21; h++) hours.push(h);
    dayTasks.forEach(function(t){ if (hours.indexOf(t.due.getHours()) === -1) hours.push(t.due.getHours()); });
    hours.sort(function(x, y){ return x - y; });
    let cols = "";
    hours.forEach(function(h){
      const inHour = dayTasks.filter(function(t){ return t.due.getHours() === h; });
      cols += '<div class="tl-col"><div class="chead">' + pad2(h) + ":00</div>" +
        (inHour.length ? cellHTML(inHour, a, "—", fmtDate(d) + " " + pad2(h) + ":00") : '<span class="tiny muted">—</span>') +
      "</div>";
    });
    body = '<div class="tl"><div class="tl-week">' + cols + "</div></div>";
  }

  const ownCount = list.filter(function(t){ return taskKind(t, a) === "own"; }).length;
  const assignedCount = list.filter(function(t){ return taskKind(t, a) === "assigned"; }).length;

  el.innerHTML =
    '<div class="segmented" role="group" aria-label="视图粒度">' +
      ["month", "week", "day"].map(function(m){
        const label = m === "month" ? "月" : m === "week" ? "周" : "日";
        return '<button type="button" data-view="' + m + '" aria-pressed="' + (state.viewMode === m) + '">' + label + "</button>";
      }).join("") +
    "</div>" +
    '<div class="card"><div class="row wrap"><strong class="small">' + esc(rangeLabel) + "</strong>" +
      '<span class="spacer"></span><span class="tiny muted">' + ownCount + " 项我负责 · " + assignedCount + " 项我派发</span></div>" +
      '<div class="legend" style="margin-top:6px">' +
        '<span><span class="kind own">我负责</span> 左侧实线</span>' +
        '<span><span class="kind assigned">我派发</span> 左侧虚线</span>' +
        '<span>排列：紧急优先，其次截止更近</span>' +
      "</div>" +
    "</div>" + body +
    '<div class="card"><div class="card-head"><h2>本范围内任务</h2><span class="hint">' + list.length + " 项</span></div>" +
      '<div class="stack">' + (list.length ? list.map(function(t){ return taskItemHTML(t, a); }).join("") : '<div class="empty">暂无任务</div>') + "</div>" +
    "</div>";

  /* 时间轴可横向滚动，默认滚到第一个有内容的时刻/今天，避免一屏空白 */
  const tlEl = el.querySelector(".tl");
  if (tlEl){
    const anchorEl = state.viewMode === "month"
      ? tlEl.querySelector(".tl-cell.is-today")
      : Array.prototype.slice.call(tlEl.querySelectorAll(".tl-col"))
          .filter(function(c){ return c.querySelector(".chip, .plusn"); })[0];
    if (anchorEl){
      const tlRect = tlEl.getBoundingClientRect();
      const aRect = anchorEl.getBoundingClientRect();
      tlEl.scrollLeft = Math.max(0, tlEl.scrollLeft + (aRect.left - tlRect.left) - 6);
    }
  }
}

/* ============================== 页面：AI地图 ============================== */
const KEYWORDS = ["校徽", "产线", "打样", "客户反馈", "总结", "排期", "支付故障", "设计规范", "竞品", "协作流程",
  "培训", "季度目标", "活动策划", "晨会", "视觉规范", "报价单", "新产品", "供应商", "预算", "物料", "样品种类", "验收"];
function keywordStats(list){
  const counts = KEYWORDS.map(function(k){
    let n = 0;
    list.forEach(function(t){ if (t.title.indexOf(k) !== -1 || (t.desc || "").indexOf(k) !== -1) n++; });
    return { word: k, n: n };
  }).filter(function(x){ return x.n > 0; });
  counts.sort(function(x, y){ return y.n - x.n || x.word.localeCompare(y.word, "zh"); });
  return counts.slice(0, 12);
}
function renderAI(){
  const a = actor();
  const el = document.getElementById("page-ai");
  const scoped = viewTasks(a);
  const deptTasks = TASKS.filter(function(t){ return taskInDept(t, a.dept); });
  const statBase = a.role === "upper" ? scoped : a.role === "middle" ? scoped : scoped;
  const cloudBase = a.role === "upper" ? TASKS.slice() : deptTasks;
  const done = statBase.filter(function(t){ return effectiveStatus(t) === "done"; }).length;
  const doing = statBase.filter(function(t){ return effectiveStatus(t) === "doing"; }).length;
  const open = statBase.filter(function(t){ return effectiveStatus(t) === "todo"; }).length;
  const review = statBase.filter(function(t){ return effectiveStatus(t) === "pending-complete" || effectiveStatus(t) === "pending-create"; }).length;
  const overdue = statBase.filter(function(t){ return isOverdue(t); }).length;
  const mine = scoped.filter(function(t){ return taskKind(t, a) === "own"; });

  const stats = [
    { k: "任务总数", v: statBase.length },
    { k: "进行中", v: doing },
    { k: "待开始", v: open },
    { k: "已完成", v: done },
    { k: "待审核", v: review },
    { k: "已逾期", v: overdue }
  ];

  const words = keywordStats(cloudBase);
  const maxN = words.length ? words[0].n : 1;
  const cloud = words.length
    ? words.map(function(w){
        const size = 12 + Math.round((w.n / maxN) * 8);
        const weight = w.n > 1 ? 700 : 500;
        const color = w.n > 1 ? "#1d4ed8" : "#4b5563";
        return '<span style="font-size:' + size + "px;font-weight:" + weight + ";color:" + color + '" title="' + esc(w.word + "：出现 " + w.n + " 次") + '">' + esc(w.word) + "</span>";
      }).join("")
    : '<span class="tiny muted">范围内暂无可提取的关键词</span>';

  const urgentMine = sortTasks(mine.filter(function(t){ return !isFinished(t); })).slice(0, 3);
  const advice = [];
  if (a.role === "upper"){
    advice.push("全公司当前共 " + statBase.length + " 项任务，其中进行中 " + doing + " 项、已完成 " + done + " 项、待审核 " + review + " 项。");
    advice.push(overdue ? "有 " + overdue + " 项任务已逾期，建议在周会上确认资源投入。" : "当前没有逾期任务，整体节奏可控。");
    advice.push("从公司词云看，校徽产线、打样与客户反馈是本周期的集中议题，建议优先保障产线交付质量。");
  } else {
    advice.push("你当前有 " + mine.length + " 项本人负责的任务，其中 " + mine.filter(function(t){ return !isFinished(t); }).length + " 项尚未完成。");
    if (urgentMine.length){
      advice.push("综合紧急程度与截止时间，" + urgentMine.map(function(t){ return "「" + t.title + "」"; }).join("、") + "最需要优先处理。");
    } else {
      advice.push("目前没有待推进的紧要任务，可关注后续派发的任务。");
    }
    advice.push("建议在日志中持续记录进度备注，便于" + (a.role === "middle" ? "你的直属上层" : "你的直属上级") + "了解进展。");
  }

  el.innerHTML =
    '<section class="card"><div class="card-head"><h2>任务数据统计</h2><span class="hint">' +
      (a.role === "upper" ? "全公司范围" : a.role === "middle" ? "本部门范围" : "本人范围") + "</span></div>" +
      '<div class="stat-grid">' + stats.map(function(s){
        return '<div class="stat"><div class="v">' + s.v + '</div><div class="k">' + s.k + "</div></div>";
      }).join("") + "</div></section>" +
    '<section class="card"><div class="card-head"><h2>关键词词云</h2><span class="hint">' +
      (a.role === "upper" ? "公司聚合" : "部门聚合（不含明细）") + "</span></div>" +
      '<div class="wc">' + cloud + "</div></section>" +
    '<section class="card"><div class="card-head"><h2>AI 建议</h2><span class="hint">' +
      (a.role === "upper" ? "公司级" : "个人向") + "</span></div>" +
      '<div>' + advice.map(function(x){ return '<div class="advice">' + esc(x) + "</div>"; }).join("") + "</div></section>";
}

/* ============================== 弹层（详情与表单） ============================== */
const overlayEl = document.getElementById("overlay");
const sheetBodyEl = document.getElementById("sheetBody");
const sheetFootEl = document.getElementById("sheetFoot");
const sheetTitleEl = document.getElementById("sheetTitle");
let sheetStack = [];
let lastFocused = null;

function renderSheet(){
  if (!sheetStack.length){
    overlayEl.hidden = true;
    document.getElementById("sheetFoot").hidden = false;
    if (lastFocused && document.contains(lastFocused)) lastFocused.focus();
    lastFocused = null;
    return;
  }
  const view = sheetStack[sheetStack.length - 1];
  sheetTitleEl.textContent = view.title;
  sheetBodyEl.innerHTML = view.body;
  sheetFootEl.innerHTML = view.foot || "";
  sheetFootEl.hidden = !view.foot;
  overlayEl.hidden = false;
  sheetBodyEl.scrollTop = 0;
  const target = sheetBodyEl.querySelector("[data-autofocus]") ||
    sheetFootEl.querySelector("button") ||
    sheetBodyEl.querySelector("button, input, select, textarea");
  if (target) target.focus();
}
function openSheet(view){
  if (!lastFocused) lastFocused = document.activeElement;
  sheetStack.push(view);
  renderSheet();
}
function replaceSheet(view){
  sheetStack[sheetStack.length - 1] = view;
  renderSheet();
}
function backSheet(){
  sheetStack.pop();
  renderSheet();
}
function closeSheet(){
  sheetStack = [];
  renderSheet();
}
function withBack(foot){
  const items = [];
  if (sheetStack.length > 1) items.push('<button type="button" class="btn" data-action="sheet-back">返回</button>');
  if (foot) items.push(foot);
  return items.join("");
}

/* ---------- 任务详情 ---------- */
function taskDetailView(id){
  const a = actor();
  const t = taskById(id);
  if (!t) return null;
  if (visibleTasks(a).indexOf(t) === -1) return null;   /* 范围外记录不展示详情 */

  const kind = taskKind(t, a);
  const allowed = visibleTasks(a);
  /* 关联任务同样受角色可见范围约束：不可见的上级/子任务/同级任务不得泄露标识信息 */
  const rawParent = t.parentId ? taskById(t.parentId) : null;
  const parent = rawParent && allowed.indexOf(rawParent) !== -1 ? rawParent : null;
  const hiddenParent = !!rawParent && !parent;
  const kids = childrenOf(t.id).filter(function(k){ return allowed.indexOf(k) !== -1; });
  /* 同级任务按真实上级关系推导，但只列出当前身份可见的同级任务 */
  const siblings = rawParent
    ? childrenOf(rawParent.id).filter(function(x){ return x.id !== t.id && allowed.indexOf(x) !== -1; })
    : [];
  const reviewer = t.status === "pending-create" ? createReviewer(t)
    : t.status === "pending-complete" ? completionReviewer(t) : null;

  let body = '<div class="row wrap">' + typeBadge(t) + statusBadge(t) + urgencyBadge(t.urgency) +
      '<span class="kind ' + kind + '">' + KIND_LABEL[kind] + "</span></div>";

  if (t.type === "abstract"){
    body += '<div class="callout">抽象任务不可直接执行，进展由普通子任务汇总得出，不提供进度录入与直接完成入口。</div>';
  }

  body += '<div class="kv">' +
      '<span class="k">名称</span><span class="v">' + esc(t.title) + "</span>" +
      '<span class="k">紧急程度</span><span class="v">' + urgencyBadge(t.urgency) + "</span>" +
      '<span class="k">创建者</span><span class="v">' + esc(creatorOf(t).name) + "</span>" +
      '<span class="k">负责人</span><span class="v">' +
        (t.type === "abstract"
          ? (kids.length ? esc(kids.map(function(k){ return assigneesOf(k).map(function(p){ return p.name; }).join("、"); }).filter(Boolean).join("、") || "由子任务决定") : "由子任务决定")
          : esc(assigneesOf(t).map(function(p){ return p.name; }).join("、") || "未指定")) + "</span>" +
      '<span class="k">截止日期</span><span class="v">' + esc(fmtDue(t.due)) + (isOverdue(t) ? ' <span class="is-overdue">已逾期</span>' : "") + "</span>" +
      '<span class="k">起止时间</span><span class="v">' + esc(fmtDateTime(t.start)) + " → " + esc(fmtDateTime(t.due)) + "</span>" +
      '<span class="k">完成情况</span><span class="v">' + esc(STATUS_LABEL[effectiveStatus(t)]) + "（" + effectiveProgress(t) + "%）</span>" +
      '<span class="k">进度备注</span><span class="v">' + (t.progressNote ? esc(t.progressNote) : "暂无") + "</span>" +
      (t.desc ? '<span class="k">说明</span><span class="v">' + esc(t.desc) + "</span>" : "") +
    "</div>";

  body += '<div class="progress-track" role="img" aria-label="完成进度 ' + effectiveProgress(t) + '%"><i style="width:' + effectiveProgress(t) + '%"></i></div>';

  if (parent){
    body += '<div class="divider"></div><div class="card-head"><h2>上级任务</h2></div>' +
      '<button type="button" class="child-task" data-task="' + parent.id + '">' +
        '<span class="t-title"><span>' + esc(parent.title) + "</span>" + typeBadge(parent) + "</span>" +
        '<span class="task-meta">' + statusBadge(parent) + urgencyBadge(parent.urgency) + "<span>" + esc(fmtDue(parent.due)) + "</span></span></button>";
  } else if (hiddenParent){
    /* 只说明存在上下级关系，不暴露范围外任务的名称、状态或时间 */
    body += '<div class="divider"></div><div class="card-head"><h2>上级任务</h2></div>' +
      '<div class="callout info">该任务属于一个上级任务，但上级任务超出当前身份的可见范围。</div>';
  }
  if (kids.length){
    const kidDone = kids.filter(function(k){ return effectiveStatus(k) === "done"; }).length;
    body += '<div class="divider"></div><div class="card-head"><h2>子任务</h2><span class="hint">' + kidDone + "/" + kids.length + ' 已完成</span></div><div class="stack">' +
      kids.map(function(k){
        return '<button type="button" class="child-task" data-task="' + k.id + '">' +
          '<span class="t-title"><span>' + esc(k.title) + "</span></span>" +
          '<span class="task-meta">' + kindTag(k, a) + statusBadge(k) + urgencyBadge(k.urgency) +
            "<span>" + esc(fmtDue(k.due)) + "</span><span>进度 " + effectiveProgress(k) + "%</span></span></button>";
      }).join("") + "</div>";
  }
  if (siblings.length){
    body += '<div class="divider"></div><div class="card-head"><h2>同级任务</h2><span class="hint">同一上级任务下</span></div><div class="stack">' +
      siblings.map(function(s){
        return '<button type="button" class="child-task" data-task="' + s.id + '">' +
          '<span class="t-title"><span>' + esc(s.title) + "</span></span>" +
          '<span class="task-meta">' + statusBadge(s) + urgencyBadge(s.urgency) + "<span>" + esc(fmtDue(s.due)) + "</span></span></button>";
      }).join("") + "</div>";
  }
  if (t.reviewNote){
    body += '<div class="callout reject">审核意见：' + esc(t.reviewNote) + "</div>";
  }
  if (reviewer){
    body += '<div class="callout info">当前审核人：' + esc(reviewer.name) +
      (t.status === "pending-create" ? "（创建审核）" : "（完成审核）") + "</div>";
  } else if (t.status === "pending-complete" && !completionReviewer(t)){
    body += '<div class="callout info">该任务没有更高的审核人，提交完成后将直接标记为已完成。</div>';
  }

  const foot = [];
  if (canEditTask(a, t)) foot.push('<button type="button" class="btn primary" data-action="edit-task" data-id="' + t.id + '">编辑任务</button>');
  if (canUpdateProgress(a, t)) foot.push('<button type="button" class="btn" data-action="update-progress" data-id="' + t.id + '">更新进度</button>');
  if (canUpdateProgress(a, t)) foot.push('<button type="button" class="btn ok" data-action="submit-complete" data-id="' + t.id + '">提交完成</button>');
  if (t.status === "pending-create" && createReviewer(t) && createReviewer(t).id === a.id){
    foot.push('<button type="button" class="btn ok" data-action="approve-create" data-id="' + t.id + '">批准创建</button>');
    foot.push('<button type="button" class="btn danger" data-action="reject-create" data-id="' + t.id + '">拒绝</button>');
  }
  if (t.status === "pending-complete" && completionReviewer(t) && completionReviewer(t).id === a.id){
    foot.push('<button type="button" class="btn ok" data-action="approve-complete" data-id="' + t.id + '">批准完成</button>');
    foot.push('<button type="button" class="btn danger" data-action="reject-complete" data-id="' + t.id + '">退回</button>');
  }
  if (!foot.length) foot.push('<button type="button" class="btn" data-action="sheet-close">关闭</button>');

  return { title: t.title, body: body, foot: withBack(foot.join(""), a) };
}

    '<input id="tf-due-time" type="time" value="' + toTimeInput(due) + '" /></div></div>';

  body += '<div class="field"><label>紧急程度</label><div class="choice-row" id="tf-urgency">' +

/* ============================== 操作与状态变更 ============================== */
let SEQ = 100;
function nextId(prefix){ SEQ += 1; return prefix + SEQ; }
function showError(elId, msg){
  const el = document.getElementById(elId);
  if (el){ el.hidden = false; el.textContent = msg; }
}
function unique(list){
  return list.filter(function(x, i){ return x && list.indexOf(x) === i; });
}
/* 任务创建通知：面向创建者与全部负责人 */
function notifyTaskCreated(t){
  const recipients = unique([t.creatorId].concat(t.assigneeIds));
  NOTIFICATIONS.push({
    id: nextId("n"), type: "create", taskId: t.id, recipients: recipients,
    time: new Date(), read: []
  });
}

function saveTask(mode, id){
  const a = actor();
  const titleEl = document.getElementById("tf-title");
  const title = titleEl ? titleEl.value.trim() : "";
  if (!title) return showError("tf-error", "请填写任务名称。");
  const dateEl = document.getElementById("tf-due-date");
  const timeEl = document.getElementById("tf-due-time");
  if (!dateEl.value || !timeEl.value) return showError("tf-error", "请填写截止日期与时刻。");
  const parts = dateEl.value.split("-").map(Number);
  const hm = timeEl.value.split(":").map(Number);
  const due = new Date(parts[0], parts[1] - 1, parts[2], hm[0], hm[1], 0, 0);
  if (isNaN(due.getTime())) return showError("tf-error", "截止时间无效。");

  const urgencyEl = document.querySelector('#tf-urgency [aria-pressed="true"]');
  const urgency = urgencyEl ? urgencyEl.dataset.urgency : "中";
  const desc = document.getElementById("tf-desc").value.trim();
  const parentSel = document.getElementById("tf-parent");
  const parentId = parentSel && parentSel.value ? parentSel.value : null;

  const existing = mode === "edit" ? taskById(id) : null;
  const type = existing ? existing.type : (document.querySelector('#tf-type [aria-pressed="true"]').dataset.type);
  let assigneeIds = [];
  if (type === "normal"){
    assigneeIds = Array.prototype.slice.call(document.querySelectorAll("[data-assignee]"))
      .filter(function(cb){ return cb.checked; })
      .map(function(cb){ return cb.dataset.assignee; });
    if (!assigneeIds.length) return showError("tf-error", "普通任务至少需要一名负责人。");
  }
  const allowed = assignablePeople(a).map(function(p){ return p.id; });
  if (assigneeIds.some(function(x){ return allowed.indexOf(x) === -1; })){
    return showError("tf-error", "存在超出当前身份范围的负责人。");
  }
  if (parentId && !taskById(parentId)){
    return showError("tf-error", "上级任务不存在。");
  }
  /* 只有当前已建立且不可见的上级关系可以被保留；重新指定必须落在可见范围内 */
  const isKeptExistingParent = !!(existing && existing.parentId === parentId);
  if (parentId && !isKeptExistingParent && visibleTasks(a).indexOf(taskById(parentId)) === -1){
    return showError("tf-error", "上级任务不在当前可见范围内。");
  }
  if (parentId && existing && parentId === existing.id){
    return showError("tf-error", "任务不能以自己作为上级任务。");
  }
  if (parentId && existing && taskById(parentId).parentId === existing.id){
    return showError("tf-error", "任务不能以自己的一级子任务作为上级任务。");
  }

  if (mode === "edit"){
    /* 提交处理同样复用编辑权限规则，而不只是隐藏入口 */
    if (!canEditTask(a, existing)) return showError("tf-error", "只有任务创建者可以修改任务信息。");
    existing.title = title;
    existing.desc = desc;
    existing.due = due;
    existing.urgency = urgency;
    existing.parentId = parentId;
    if (existing.type === "normal"){
      existing.assigneeIds = assigneeIds;
      existing.selfCreated = assigneeIds.indexOf(existing.creatorId) !== -1;
      const p = document.getElementById("tf-progress");
      if (p){ existing.progress = Math.max(0, Math.min(100, Number(p.value) || 0)); }
    }
    renderAll();
    closeSheet();
    return;
  }

  const selfCreated = type === "abstract" ? a.role !== "upper" : assigneeIds.indexOf(a.id) !== -1;
  const t = mkTask({
    id: nextId("t"), type: type, title: title, desc: desc, parentId: parentId,
    creatorId: a.id, assigneeIds: assigneeIds, selfCreated: selfCreated,
    start: new Date(), due: due, urgency: urgency, status: "todo", progress: 0, progressNote: ""
  });
  const progressEl = document.getElementById("tf-progress");
  if (progressEl && type === "normal"){
    t.progress = Math.max(0, Math.min(100, Number(progressEl.value) || 0));
    if (t.progress > 0) t.status = "doing";
  }
  const reviewer = createReviewer(t);
  if (selfCreated && reviewer){
    t.status = "pending-create";
    t.progress = 0;
  }
  TASKS.push(t);
  if (t.status !== "pending-create") notifyTaskCreated(t);
  renderAll();
  closeSheet();
}

function saveProgress(id){
  const a = actor();
  const t = taskById(id);
  if (!t || !canUpdateProgress(a, t)) return;
  const p = Number(document.getElementById("pf-progress").value);
  if (isNaN(p) || p < 0 || p > 100) return showError("pf-error", "进度需为 0 到 100 之间的数字。");
  t.progress = Math.round(p);
  t.progressNote = document.getElementById("pf-note").value.trim();
  if (t.progress > 0 && t.status === "todo") t.status = "doing";
  renderAll();
  closeSheet();
}
function confirmComplete(id){
  const a = actor();
  const t = taskById(id);
  if (!t || !canUpdateProgress(a, t)) return;
  const noteEl = document.getElementById("cf-note");
  if (noteEl && noteEl.value.trim()) t.progressNote = noteEl.value.trim();
  t.progress = 100;
  const reviewer = completionReviewer(t);
  t.status = reviewer ? "pending-complete" : "done";
  t.reviewNote = "";
  renderAll();
  closeSheet();
}
function approveCreate(id){
  const a = actor();
  const t = taskById(id);
  if (!t || t.status !== "pending-create") return;
  const r = createReviewer(t);
  if (!r || r.id !== a.id) return;
  t.status = "todo";
  t.reviewNote = "";
  notifyTaskCreated(t);
  afterReviewAction();
}
function rejectTask(kind, id, reason){
  const a = actor();
  const t = taskById(id);
  if (!t) return;
  if (kind === "create"){
    const r = createReviewer(t);
    if (!r || r.id !== a.id || t.status !== "pending-create") return;
    t.status = "rejected";
    t.reviewNote = reason;
  } else {
    const r = completionReviewer(t);
    if (!r || r.id !== a.id || t.status !== "pending-complete") return;
    t.status = "doing";
    t.reviewNote = reason;
  }
  afterReviewAction();
}
function approveComplete(id){
  const a = actor();
  const t = taskById(id);
  if (!t || t.status !== "pending-complete") return;
  const r = completionReviewer(t);
  if (!r || r.id !== a.id) return;
  t.status = "done";
  t.progress = 100;
  t.reviewNote = "";
  afterReviewAction();
}
/* 审核后：若停留在“待我审核”弹层则刷新内容，否则关闭弹层 */
function afterReviewAction(){
  const top = sheetStack[sheetStack.length - 1];
  const inReview = top && top.title === "待我审核";
  renderAll();
  if (inReview && (pendingCreateFor(actor()).length || pendingCompleteFor(actor()).length)){
    replaceSheet(reviewCenterView());
  } else {
    closeSheet();
  }
}

function saveLog(id){

  if (!content) return showError("lf-error", "请填写日志内容。");

  const taskId = taskSel && taskSel.value ? taskSel.value : null;

    l.content = content;
    l.taskId = taskId;
  } else {
    LOGS.push({ id: nextId("l"), authorId: a.id, time: new Date(), taskId: taskId, content: content });
  }
  renderAll();
  closeSheet();

  c.replyTime = new Date();

function materializePersonal(pid){
  const st = ensurePersonal(pid);
  if (!st.edited){
    st.items = personalItemsFor(pid).map(function(x){ return { id: x.id, text: x.text, logId: x.logId }; });
    st.edited = true;
  }
  return st;
}
function savePersonalItem(id){
  const a = actor();
  const st = materializePersonal(a.id);

    const it = st.items.find(function(x){ return x.id === id; });
    if (!it) return;
    it.text = text;
  } else {
    if (st.items.length >= 10) return showError("pi-error", "个人信息最多 10 条。");
    st.items.push({ id: nextId("pi"), text: text, logId: null });
  }
  renderAll();
  closeSheet();
}

}
function openNotifications(){
  openSheet(notificationsView());
}

/* ============================== 事件与渲染调度 ============================== */
const PAGE_TITLE = { map: "导图", view: "视图", log: "日志", ai: "AI地图", me: "我的" };
const RENDER = { map: renderMap, view: renderView, log: renderLog, ai: renderAI, me: renderMe };

function renderAll(){
  const a = actor();
  document.getElementById("whoami").textContent = a.name.replace(/（.*$/, "") + " · " + ROLE_LABEL[a.role];
  document.getElementById("pageTitle").textContent = PAGE_TITLE[state.page];
  document.querySelectorAll("#tabbar button").forEach(function(b){
    b.setAttribute("aria-selected", String(b.dataset.page === state.page));
  });
  document.querySelectorAll(".page").forEach(function(p){
    p.classList.toggle("is-active", p.id === "page-" + state.page);
  });
  RENDER[state.page]();
  const n = unreadCount(a);
  const dot = document.getElementById("bellDot");
  dot.hidden = n === 0;
  dot.textContent = n > 9 ? "9+" : String(n);
  document.getElementById("bellBtn").setAttribute("aria-label", n ? "通知，" + n + " 条未读" : "通知，无未读");
  document.querySelectorAll(".role-switch button").forEach(function(b){
    b.setAttribute("aria-pressed", String(ROLE_ACCOUNT[b.dataset.role] === a.id));
  });
}
function setRole(role){
  state.actorId = ROLE_ACCOUNT[role];
  closeSheet();
  renderAll();
}
function setPage(page){
  state.page = page;
  renderAll();
  document.getElementById("appMain").scrollTop = 0;
}

/* 弹层内的临时选择状态 */
const formChoice = { type: "normal", urgency: "中" };
function syncChoiceRow(selector, attr, value){
  document.querySelectorAll(selector + " [" + attr + "]").forEach(function(b){
    b.setAttribute("aria-pressed", String(b.dataset[attr.replace("data-", "")] === value));
  });
}

function runAction(el){
  const action = el.dataset.action;
  const id = el.dataset.id;
  switch (action){
    case "sheet-close": closeSheet(); return;
    case "sheet-back": backSheet(); return;
    case "new-log": openSheet(logFormView()); return;
    case "edit-log": openSheet(logFormView(id)); return;
    case "new-task":
      formChoice.type = "normal"; formChoice.urgency = "中";
      openSheet(taskFormView("create")); return;
    case "edit-task": openSheet(taskFormView("edit", id)); return;
    case "update-progress": openSheet(progressFormView(id)); return;
    case "submit-complete": openSheet(submitCompleteView(id)); return;
    case "save-task": saveTask(el.dataset.mode, id); return;
    case "save-log": saveLog(id); return;
    case "save-progress": saveProgress(id); return;
    case "confirm-complete": confirmComplete(id); return;
    case "approve-create": approveCreate(id); return;
    case "approve-complete": approveComplete(id); return;
    case "reject-create": openSheet(rejectFormView("create", id)); return;
    case "reject-complete": openSheet(rejectFormView("complete", id)); return;
    case "confirm-reject":
      const reason = document.getElementById("rj-reason").value.trim();
      if (!reason) return showError("rj-error", "请填写原因。");
      rejectTask(el.dataset.kind, id, reason);
      return;
    case "new-consult": openSheet(consultFormView()); return;
    case "save-consult": saveConsult(); return;
    case "reply-consult": openSheet(replyConsultView(id)); return;
    case "save-reply": saveReply(id); return;
    case "review-center": openSheet(reviewCenterView()); return;
    case "open-notif":
      const n = NOTIFICATIONS.find(function(x){ return x.id === id; });
      if (n){
        if (n.read.indexOf(actor().id) === -1) n.read.push(actor().id);
        const tv = taskDetailView(n.taskId);
        sheetStack = [];
        renderAll();
        if (tv) openSheet(tv);
      }
      return;
    case "save-company": saveCompanyItem(id); return;
    case "save-personal": savePersonalItem(id); return;
    default: return;
  }
}

document.addEventListener("click", function(ev){
  const roleEl = ev.target.closest("[data-role]");
  if (roleEl){ setRole(roleEl.dataset.role); return; }
  const pageEl = ev.target.closest("[data-page]");
  if (pageEl){ setPage(pageEl.dataset.page); return; }
  const viewEl = ev.target.closest("[data-view]");
  if (viewEl){ state.viewMode = viewEl.dataset.view; renderAll(); return; }
  const ovEl = ev.target.closest("[data-overflow]");
  if (ovEl){
    const v = overflowView(ovEl.dataset.overflow);
    if (v) openSheet(v);
    return;
  }
  const taskEl = ev.target.closest("[data-task]");
  if (taskEl){ openTaskDetail(taskEl.dataset.task); return; }
  const logEl = ev.target.closest("[data-log]");
  if (logEl){ openLogDetail(logEl.dataset.log); return; }
  const compEl = ev.target.closest("[data-edit-company]");
  if (compEl){ const v = companyItemFormView(compEl.dataset.editCompany); if (v) openSheet(v); return; }
  const persEl = ev.target.closest("[data-edit-personal]");
  if (persEl){ const v = personalItemFormView(persEl.dataset.editPersonal); if (v) openSheet(v); return; }
  const typeEl = ev.target.closest("[data-type]");
  if (typeEl){
    formChoice.type = typeEl.dataset.type;
    syncChoiceRow("#tf-type", "data-type", formChoice.type);
    const field = document.getElementById("tf-assignee-field");
    const prog = document.getElementById("tf-progress-field");
    if (field) field.hidden = formChoice.type === "abstract";
    if (prog) prog.hidden = formChoice.type === "abstract";
    return;
  }
  const urgencyEl = ev.target.closest("[data-urgency]");
  if (urgencyEl){
    formChoice.urgency = urgencyEl.dataset.urgency;
    syncChoiceRow("#tf-urgency", "data-urgency", formChoice.urgency);
    return;
  }
  const actionEl = ev.target.closest("[data-action]");
  if (actionEl){ runAction(actionEl); return; }
  if (ev.target === overlayEl) closeSheet();
});

document.getElementById("bellBtn").addEventListener("click", openNotifications);
document.getElementById("sheetClose").addEventListener("click", closeSheet);

document.addEventListener("keydown", function(ev){
  if (overlayEl.hidden) return;
  if (ev.key === "Escape"){
    ev.preventDefault();
    if (sheetStack.length > 1) backSheet(); else closeSheet();
    return;
  }
  if (ev.key === "Tab"){
    const focusables = sheetBodyEl.querySelectorAll("button, input, select, textarea, [href]");
    const footFocusables = sheetFootEl.querySelectorAll("button");
    const list = Array.prototype.slice.call(focusables).concat(Array.prototype.slice.call(footFocusables))
      .filter(function(el){ return !el.disabled && el.offsetParent !== null; });
    if (!list.length) return;
    const first = list[0], last = list[list.length - 1];
    if (ev.shiftKey && document.activeElement === first){ ev.preventDefault(); last.focus(); }
    else if (!ev.shiftKey && document.activeElement === last){ ev.preventDefault(); first.focus(); }
  }
});

renderAll();
</script>
</body>
</html>
