{4}-\\d{2}-\\d{2}$/.test(value || '')) return null;\n    const date = new Date(value + 'T00:00:00Z');\n    return Number.isFinite(+date) \u0026\u0026 format(date) === value ? date : null;\n  }\n  function add(value, n) { const d = parse(value); return d ? format(new Date(+d+n*DAY)) : ''; }\n  function pretty(value) { const d = parse(value); return d ? `${d.getUTCMonth()+1}月${d.getUTCDate()}日` : '未设置'; }\n  function unique(tasks) { return Array.from(new Map(tasks.map(t=\u003e[t.id,t])).values()); }\n  function executable(tasks) { return unique(tasks).filter(t=\u003e!t.summary\u0026\u0026!['draft','cancelled'].includes(t.status)); }\n  function valid(task) { return !!parse(task.start)\u0026\u0026!!parse(task.due)\u0026\u0026task.start\u003c=task.due; }\n  function open(task) { return !['done','cancelled','draft'].includes(task.status); }\n  function risk(task, today) {\n    const remaining = parse(task.due)\u0026\u0026parse(today) ? (+parse(task.due)-+parse(today))/DAY : null;\n    return {overdue:open(task)\u0026\u0026remaining!==null\u0026\u0026remaining\u003c0,soon:open(task)\u0026\u0026remaining!==null\u0026\u0026remaining\u003e=0\u0026\u0026remaining\u003c=3};\n  }\n  function person(ctx,id) { return ctx.people.find(p=\u003ep.id===id)||{name:'未指派',color:'#8a93aa',department:'未分配'}; }\n  function startWeek(value) { const d=parse(value); return add(value,-((d.getUTCDay()+6)%7)); }\n  function scheduleState(ctx) {\n    if (!ctx.ui.insightsSchedule) ctx.ui.insightsSchedule={mode:'week',anchor:ctx.today,group:'task'};\n    return ctx.ui.insightsSchedule;\n  }\n  function analyticsState(ctx) {\n    if (!ctx.ui.insightsAnalytics) ctx.ui.insightsAnalytics={range:'month',department:'',owner:'',goal:'',detail:'all',detailDepartment:'',from:ctx.today.slice(0,7)+'-01',to:ctx.today,report:null};\n    return ctx.ui.insightsAnalytics;\n  }\n  function schedulePeriod(s) {\n    const anchor=parse(s.anchor);\n    const from=s.mode==='day'?s.anchor:s.mode==='week'?startWeek(s.anchor):`${s.anchor.slice(0,7)}-01`;\n    const to=s.mode==='day'?from:s.mode==='week'?add(from,6):format(new Date(Date.UTC(anchor.getUTCFullYear(),anchor.getUTCMonth()+1,0)));\n    return {from,to,count:Math.round((+parse(to)-+parse(from))/DAY)+1};\n  }\n  function period(a,today) {\n    if(a.range==='all') return {from:'',to:'',label:'全部时间'};\n    if(a.range==='week') { const from=startWeek(today);return {from,to:add(from,6),label:'本周'}; }\n    if(a.range==='custom') return {from:a.from,to:a.to,label:'自定义时间'};\n    const d=parse(today);return {from:today.slice(0,7)+'-01',to:format(new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth()+1,0))),label:'本月'};\n  }\n  function analyticsTasks(ctx,a) {\n    const r=period(a,ctx.today);\n    if(r.from\u0026\u0026r.to\u0026\u0026r.from\u003er.to) return [];\n    return executable(ctx.tasks).filter(t=\u003e(!a.department||t.department===a.department)\u0026\u0026(!a.owner||t.owner===a.owner)\u0026\u0026(!a.goal||t.goal===a.goal)\u0026\u0026(!r.from\u0026\u0026!r.to||(parse(t.due)\u0026\u0026(!r.from||t.due\u003e=r.from)\u0026\u0026(!r.to||t.due\u003c=r.to))));\n  }\n  function badge(label,type='') { return `\u003cspan class=\"insights-tag ${type}\"\u003e${label}\u003c/span\u003e`; }\n  function riskTags(task,ctx,conflict) { const r=risk(task,ctx.today);return `${r.overdue?badge('逾期','insights-danger'):r.soon?badge('临期','insights-warning'):''}${task.blocked?badge('阻塞','insights-danger'):''}${conflict?badge('排期重叠','insights-warning'):''}`; }\n  function taskRows(tasks,ctx,emptyText) {\n    const h=ctx.h;\n    return tasks.length?tasks.map(t=\u003e{const p=person(ctx,t.owner);return `\u003cbutton class=\"insights-task-row\" data-action=\"open-task\" data-id=\"${h(t.id)}\"\u003e\u003cspan class=\"insights-task-dot\" style=\"background:${statusColors[t.status]||statusColors.todo}\"\u003e\u003c/span\u003e\u003cspan class=\"insights-task-main\"\u003e\u003cstrong\u003e${h(t.title)}\u003c/strong\u003e\u003csmall\u003e${h(t.department||p.department)} · ${h(p.name)}${t.goal?` · ${h(t.goal)}`:''}\u003c/small\u003e\u003c/span\u003e\u003cspan class=\"insights-task-tags\"\u003e${riskTags(t,ctx)}${badge(statusLabels[t.status]||t.status)}\u003c/span\u003e\u003cspan class=\"insights-task-date\"\u003e${pretty(t.due)}\u003c/span\u003e\u003cspan class=\"insights-chevron\"\u003e›\u003c/span\u003e\u003c/button\u003e`;}).join(''):`\u003cdiv class=\"insights-empty\"\u003e${emptyText||'没有符合当前条件的任务'}\u003c/div\u003e`;\n  }\n  function renderSchedule(ctx) {\n    const h=ctx.h,s=scheduleState(ctx),p=schedulePeriod(s);\n    const tasks=unique(ctx.tasks).filter(t=\u003e!t.summary\u0026\u0026t.status!=='cancelled');\n    const scheduled=tasks.filter(valid),pending=tasks.filter(t=\u003e!valid(t));\n    const visible=scheduled.filter(t=\u003et.start\u003c=p.to\u0026\u0026t.due\u003e=p.from).sort((a,b)=\u003ea.start.localeCompare(b.start)||a.due.localeCompare(b.due));\n    const conflicts=new Set();\n    scheduled.filter(t=\u003eopen(t)\u0026\u0026t.owner).forEach((t,i,list)=\u003e{list.slice(i+1).forEach(other=\u003e{if(t.owner===other.owner\u0026\u0026t.start\u003c=other.due\u0026\u0026other.start\u003c=t.due){conflicts.add(t.id);conflicts.add(other.id);}});});\n    const risks=visible.filter(t=\u003erisk(t,ctx.today).overdue).length;\n    const days=Array.from({length:p.count},(_,i)=\u003eadd(p.from,i));\n    const todayIndex=days.indexOf(ctx.today);\n    const title=s.mode==='month'?`${parse(s.anchor).getUTCFullYear()}年${parse(s.anchor).getUTCMonth()+1}月`:s.mode==='day'?`${parse(s.anchor).getUTCFullYear()}年${pretty(s.anchor)}`:`${pretty(p.from)} — ${pretty(p.to)}`;\n    function row(t) {\n      const start=Math.max(0,(+parse(t.start)-+parse(p.from))/DAY),end=Math.min(p.count,(+parse(t.due)-+parse(p.from))/DAY+1),owner=person(ctx,t.owner),r=risk(t,ctx.today);\n      const color=t.status==='done'?'#59b6ac':r.overdue?'#db8b79':statusColors[t.status]||'#6171db';\n      return `\u003cdiv class=\"schedule-row\"\u003e\u003cbutton class=\"schedule-label\" data-action=\"open-task\" data-id=\"${h(t.id)}\"\u003e\u003cspan class=\"schedule-task-name\"\u003e${h(t.title)}\u003c/span\u003e\u003cspan class=\"schedule-label-meta\"\u003e\u003cspan class=\"insights-avatar\" style=\"background:${h(owner.color)}\"\u003e${h(owner.name.slice(-2))}\u003c/span\u003e${h(owner.name)}\u003cspan class=\"schedule-row-flags\"\u003e${riskTags(t,ctx,conflicts.has(t.id))}\u003c/span\u003e\u003c/span\u003e\u003c/button\u003e\u003cdiv class=\"schedule-track\" style=\"--schedule-columns:${p.count}\"\u003e${todayIndex\u003e=0?`\u003cspan class=\"schedule-today-line\" style=\"left:${(todayIndex+.5)/p.count*100}%\"\u003e\u003c/span\u003e`:''}\u003cbutton class=\"schedule-bar ${t.status==='done'?'schedule-complete':''}\" style=\"left:calc(${start/p.count*100}% + 5px);width:calc(${(end-start)/p.count*100}% - 10px);--schedule-bar-color:${color}\" data-action=\"open-task\" data-id=\"${h(t.id)}\" title=\"${h(t.title)} · ${h(owner.name)} · ${t.start} 至 ${t.due} · ${statusLabels[t.status]||''} · ${Math.max(0,Math.min(100,Number(t.progress)||0))}%\"\u003e\u003cspan class=\"schedule-bar-progress\" style=\"width:${Math.max(0,Math.min(100,Number(t.progress)||0))}%\"\u003e\u003c/span\u003e\u003cspan class=\"schedule-bar-text\"\u003e${h(t.title)}\u003c/span\u003e${end-start\u003e1||s.mode==='day'?`\u003cb\u003e${Math.max(0,Math.min(100,Number(t.progress)||0))}%\u003c/b\u003e`:''}\u003c/button\u003e\u003c/div\u003e\u003c/div\u003e`;\n    }\n    let rows=visible.map(row).join('');\n    if(s.group==='person') rows=[...new Set(visible.map(t=\u003et.owner))].map(id=\u003e{const owner=person(ctx,id),group=visible.filter(t=\u003et.owner===id);return `\u003cdiv class=\"schedule-group\"\u003e\u003cspan class=\"insights-avatar\" style=\"background:${h(owner.color)}\"\u003e${h(owner.name.slice(-2))}\u003c/span\u003e\u003cstrong\u003e${h(owner.name)}\u003c/strong\u003e\u003cspan\u003e${h(owner.department)} · ${group.length} 项任务\u003c/span\u003e\u003c/div\u003e${group.map(row).join('')}`;}).join('');\n    return `\u003csection class=\"insights-page schedule-page\"\u003e\u003cdiv class=\"page-heading\"\u003e\u003cdiv\u003e\u003ch1\u003e任务视图\u003c/h1\u003e\u003cp\u003e把工作放进时间里，让协作更有节奏。\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"insights-heading-note\"\u003e\u003cspan class=\"insights-live-dot\"\u003e\u003c/span\u003e 与任务清单实时同步\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"card schedule-main\"\u003e\u003cdiv class=\"schedule-toolbar\"\u003e\u003cdiv class=\"insights-segment\" aria-label=\"排期时间粒度\"\u003e${[['day','日'],['week','周'],['month','月']].map(([value,label])=\u003e`\u003cbutton data-action=\"insights-mode\" data-value=\"${value}\" class=\"${s.mode===value?'active':''}\" aria-pressed=\"${s.mode===value}\"\u003e${label}\u003c/button\u003e`).join('')}\u003c/div\u003e\u003cdiv class=\"schedule-period\"\u003e\u003cbutton class=\"insights-icon-button\" data-action=\"insights-prev\" aria-label=\"上一${s.mode==='day'?'天':s.mode==='week'?'周':'月'}\"\u003e‹\u003c/button\u003e\u003cstrong\u003e${title}\u003c/strong\u003e\u003cbutton class=\"insights-icon-button\" data-action=\"insights-next\" aria-label=\"下一${s.mode==='day'?'天':s.mode==='week'?'周':'月'}\"\u003e›\u003c/button\u003e\u003cbutton class=\"btn insights-today-button\" data-action=\"insights-today\"\u003e今天\u003c/button\u003e\u003c/div\u003e\u003clabel class=\"insights-select-label\"\u003e分组\u003cselect data-insights=\"schedule-group\" aria-label=\"排期分组\"\u003e\u003coption value=\"task\" ${s.group==='task'?'selected':''}\u003e按任务\u003c/option\u003e\u003coption value=\"person\" ${s.group==='person'?'selected':''}\u003e按人员\u003c/option\u003e\u003c/select\u003e\u003c/label\u003e\u003c/div\u003e\u003cdiv class=\"schedule-summary\"\u003e\u003cspan\u003e当前时段 \u003cb\u003e${visible.length}\u003c/b\u003e 项执行任务\u003c/span\u003e\u003cspan\u003e\u003ci class=\"insights-dot insights-dot-blue\"\u003e\u003c/i\u003e进行中\u003c/span\u003e\u003cspan\u003e\u003ci class=\"insights-dot insights-dot-green\"\u003e\u003c/i\u003e已完成\u003c/span\u003e\u003cspan\u003e\u003ci class=\"insights-dot insights-dot-coral\"\u003e\u003c/i\u003e逾期 ${risks}\u003c/span\u003e\u003cspan class=\"schedule-summary-end\"\u003e${s.mode==='day'?'任务按日期排期，不区分具体时刻':'点击任务条查看完整排期与进展'}\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"schedule-scroll\"\u003e\u003cdiv class=\"schedule-grid schedule-grid-${s.mode}\"\u003e\u003cdiv class=\"schedule-grid-header\"\u003e\u003cdiv class=\"schedule-corner\"\u003e任务 / 负责人\u003c/div\u003e\u003cdiv class=\"schedule-days\" style=\"grid-template-columns:repeat(${p.count},minmax(0,1fr))\"\u003e${days.map(date=\u003e{const d=parse(date),isToday=date===ctx.today,isWeekend=[0,6].includes(d.getUTCDay());return `\u003cdiv class=\"schedule-day ${isToday?'schedule-day-today':''} ${isWeekend?'schedule-weekend':''}\"\u003e\u003cspan\u003e${s.mode==='month'?['日','一','二','三','四','五','六'][d.getUTCDay()]:['周日','周一','周二','周三','周四','周五','周六'][d.getUTCDay()]}\u003c/span\u003e\u003cb\u003e${s.mode==='day'?`${d.getUTCMonth()+1} / ${d.getUTCDate()} · 全天`:d.getUTCDate()}\u003c/b\u003e\u003c/div\u003e`;}).join('')}\u003c/div\u003e\u003c/div\u003e${rows||'\u003cdiv class=\"insights-empty\"\u003e这个时段还没有任务安排，可切换日期或为待排期任务补充时间。\u003c/div\u003e'}\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"schedule-footer\"\u003e\u003cspan\u003e\u003ci class=\"insights-dot insights-dot-blue\"\u003e\u003c/i\u003e 今日标线\u003c/span\u003e\u003cspan\u003e重叠表示同一负责人存在日期交集，仅作协调提示\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"schedule-lower\"\u003e\u003cdiv class=\"card schedule-pending\"\u003e\u003cdiv class=\"insights-card-heading\"\u003e\u003cdiv\u003e\u003ch2\u003e待排期\u003c/h2\u003e\u003cp\u003e补充有效起止时间，任务就会出现在视图中\u003c/p\u003e\u003c/div\u003e\u003cspan class=\"insights-count\"\u003e${pending.length}\u003c/span\u003e\u003c/div\u003e${taskRows(pending,ctx,'所有执行任务都已设置有效排期')}\u003c/div\u003e\u003caside class=\"card schedule-guide\"\u003e\u003cspan class=\"insights-eyebrow\"\u003e协作提醒\u003c/span\u003e\u003ch2\u003e留一点空间，\u003cbr\u003e让安排更从容。\u003c/h2\u003e\u003cp\u003e相同负责人的任务可能同时推进。遇到重叠时，结合工作量与优先级协调安排。\u003c/p\u003e\u003cdiv class=\"schedule-guide-note\"\u003e${visible.filter(t=\u003econflicts.has(t.id)).length?`当前时段有 \u003cb\u003e${visible.filter(t=\u003econflicts.has(t.id)).length}\u003c/b\u003e 项任务存在排期重叠`:'当前时段暂无排期重叠'}\u003cbr\u003e时间调整请从任务详情中发起\u003c/div\u003e\u003c/aside\u003e\u003c/div\u003e\u003c/section\u003e`;\n  }\n  function matchesDetail(task,a,today) {\n    if(a.detailDepartment\u0026\u0026task.department!==a.detailDepartment)return false;\n    if(a.detail==='incomplete')return task.status!=='done';\n    if(a.detail==='overdue')return risk(task,today).overdue;\n    if(a.detail==='soon')return risk(task,today).soon;\n    if(a.detail==='blocked')return !!task.blocked;\n    if(['todo','doing','review','done'].includes(a.detail))return task.status===a.detail;\n    return true;\n  }\n  function renderAnalytics(ctx) {\n    const h=ctx.h,a=analyticsState(ctx),tasks=analyticsTasks(ctx,a),r=period(a,ctx.today),done=tasks.filter(t=\u003et.status==='done').length,overdue=tasks.filter(t=\u003erisk(t,ctx.today).overdue).length,blocked=tasks.filter(t=\u003et.blocked).length,soon=tasks.filter(t=\u003erisk(t,ctx.today).soon).length;\n    const filtered=tasks.filter(t=\u003ematchesDetail(t,a,ctx.today)),rate=tasks.length?Math.round(done/tasks.length*100):null;\n    const all=executable(ctx.tasks),depts=[...new Set(all.map(t=\u003et.department).filter(Boolean))],goals=[...new Set(all.map(t=\u003et.goal).filter(Boolean))];\n    const opts=(values,value,placeholder)=\u003e`\u003coption value=\"\"\u003e${placeholder}\u003c/option\u003e${values.map(v=\u003e`\u003coption value=\"${h(v)}\" ${value===v?'selected':''}\u003e${h(v)}\u003c/option\u003e`).join('')}`;\n    const detailName={all:'全部任务',incomplete:'未完成任务',overdue:'逾期任务',soon:'临期任务',blocked:'阻塞任务',todo:'待开始任务',doing:'进行中任务',review:'待确认任务',done:'已完成任务'}[a.detail]||'任务明细';\n    const stats=[{id:'all',label:'执行任务总数',value:tasks.length,unit:'项',note:'按唯一任务编号统计',color:'blue',symbol:'▤'},{id:'done',label:'任务完成率',value:rate===null?'—':rate,unit:rate===null?'':'%',note:`${done} 项已完成 / ${tasks.length} 项执行任务`,color:'green',symbol:'✓'},{id:'overdue',label:'逾期任务',value:overdue,unit:'项',note:'已超过当前生效截止日期',color:'coral',symbol:'◷'},{id:'blocked',label:'阻塞任务',value:blocked,unit:'项',note:'需要关注的协作困难',color:'purple',symbol:'!'}];\n    const statusChart=['todo','doing','review','done'].map(status=\u003e{const count=tasks.filter(t=\u003et.status===status).length;return `\u003cbutton class=\"analytics-status-row ${a.detail===status?'selected':''}\" data-action=\"insights-detail\" data-value=\"${status}\"\u003e\u003cspan\u003e\u003ci style=\"background:${statusColors[status]}\"\u003e\u003c/i\u003e${statusLabels[status]}\u003c/span\u003e\u003cdiv class=\"analytics-status-track\"\u003e\u003ci style=\"width:${tasks.length?count/tasks.length*100:0}%;background:${statusColors[status]}\"\u003e\u003c/i\u003e\u003c/div\u003e\u003cstrong\u003e${count}\u003c/strong\u003e\u003csmall\u003e${tasks.length?Math.round(count/tasks.length*100)+'%':'—'}\u003c/small\u003e\u003c/button\u003e`;}).join('');\n    const deptRows=depts.map(department=\u003e{const list=tasks.filter(t=\u003et.department===department),count=list.length,completed=list.filter(t=\u003et.status==='done').length;return {department,count,completed};}).filter(d=\u003ed.count).sort((a,b)=\u003eb.count-a.count);\n    const maxDept=Math.max(1,...deptRows.map(d=\u003ed.count));\n    const departmentChart=deptRows.map(d=\u003e`\u003cbutton class=\"analytics-dept-row\" data-action=\"insights-department-detail\" data-value=\"${h(d.department)}\"\u003e\u003cspan\u003e${h(d.department)}\u003c/span\u003e\u003cdiv class=\"analytics-dept-track\"\u003e\u003cdiv style=\"width:${d.count/maxDept*100}%\"\u003e\u003ci style=\"width:${d.completed/d.count*100}%\"\u003e\u003c/i\u003e\u003c/div\u003e\u003c/div\u003e\u003cstrong\u003 color){const list=boardTasks(kind);return `\u003csection class=\"board card\"\u003e\u003cheader class=\"board-header\"\u003e\u003cspan class=\"board-icon ${color}\"\u003e${icon(ic)}\u003c/span\u003e\u003cdiv class=\"board-title\"\u003e\u003ch2\u003e${title}\u003cspan class=\"board-count\"\u003e${list.length}\u003c/span\u003e\u003c/h2\u003e\u003cp\u003e${subtitle}\u003c/p\u003e\u003c/div\u003e\u003cbutton class=\"icon-btn\" aria-label=\"查看全部${title}\" data-action=\"view-list\" data-scope=\"${kind}\"\u003e${icon('dots')}\u003c/button\u003e\u003c/header\u003e\u003cdiv class=\"board-body\"\u003e${list.length?list.slice(0,10).map(taskRow).join(''):empty('这里还没有重点工作','将任务加入重点清单，随时关注进展。')}\u003c/div\u003e\u003cfooter class=\"board-footer\"\u003e\u003cspan\u003e${list.length\u003e10?'默认展示前 10 项重点':'每一项重点，都值得被看见'}\u003c/span\u003e\u003cbutton data-action=\"view-list\" data-scope=\"${kind}\"\u003e查看全部 ${icon('chevron')}\u003c/button\u003e\u003c/footer\u003e\u003c/section\u003e`;}\nfunction visibleLogs(){return state.logs.filter(l=\u003el.author===actor().id||state.role==='executive'||state.role==='admin'||state.role==='manager'\u0026\u0026person(l.author).department===actor().department||(l.taskId\u0026\u0026findTask(l.taskId)\u0026\u0026[findTask(l.taskId).owner,...findTask(l.taskId).collaborators].includes(actor().id)));}\nfunction logBoard(){const list=visibleLogs().filter(l=\u003el.author===actor().id\u0026\u0026l.date===today);return `\u003csection class=\"board card log-board\"\u003e\u003cheader class=\"board-header\"\u003e\u003cspan class=\"board-icon teal\"\u003e${icon('book')}\u003c/span\u003e\u003cdiv class=\"board-title\"\u003e\u003ch2\u003e今日日志 \u003cspan class=\"board-count\"\u003e${list.length}\u003c/span\u003e\u003c/h2\u003e\u003cp\u003e记录过程，也记录每一点成长\u003c/p\u003e\u003c/div\u003e\u003cspan class=\"small muted\"\u003e${shortDate(today)}\u003c/span\u003e\u003c/header\u003e\u003cdiv class=\"board-body log-board-body\"\u003e${list.length?list.slice(0,2).map(l=\u003e
