<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
<title>潘多拉 · 工作台</title>
<meta name="theme-color" content="#fff9fc" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<script>if (location.protocol === 'file:') location.replace('http://127.0.0.1:8080/' + location.search + location.hash);</script>
<link rel="stylesheet" href="潘多拉-交互原型.css?v=77d2420332cf" />
<link rel="stylesheet" href="潘多拉-界面调整.css?v=4444b358ce21" />
<link rel="stylesheet" href="潘多拉-正式版.css?v=b32d8310dacc" />
<link rel="stylesheet" href="潘多拉-日历.css?v=36539269a44a" />
<link rel="stylesheet" href="潘多拉-任务表单.css?v=31a5d34bb9f8" />
<link rel="stylesheet" href="潘多拉-手账主题.css?v=b4589be924c4" />
<link rel="icon" type="image/svg+xml" href="潘多拉-手账标记.svg?v=51ec58a6ecee" />
</head>
<body>
<noscript>请启用浏览器 JavaScript 后使用潘多拉。</noscript>


<div class="stage">
  <div class="phone">
    <div class="app is-auth">
      <header class="app-header">
        <div class="app-brand" aria-label="潘多拉"><img src="潘多拉-手账标记.svg?v=51ec58a6ecee" alt="" width="32" height="32" /></div><h1 id="pageTitle">工作台</h1>
        <span class="who" id="whoami">—</span>
        <button class="bell" id="bellBtn" type="button" aria-label="通知">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
          <span class="dot" id="bellDot" hidden></span>
        </button>
      </header>

      <main class="app-main" id="appMain">
        <section class="page is-active" id="page-map" aria-labelledby="pageTitle"><div class="startup-status" role="status">正在打开潘多拉…</div></section>
        <section class="page" id="page-view" aria-labelledby="pageTitle"></section>
        <section class="page" id="page-log" aria-labelledby="pageTitle"></section>
        <section class="page" id="page-ai" aria-labelledby="pageTitle"></section>
        <section class="page" id="page-me" aria-labelledby="pageTitle"></section>
      </main>

      <button class="to-top" id="toTopBtn" type="button" aria-label="回到日志顶部" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
      </button>

      <nav class="tabbar" id="tabbar" role="tablist" aria-label="主导航">
        <button type="button" role="tab" data-page="map" aria-selected="true" aria-controls="page-map">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
          <span>工作台</span>
        </button>
        <button type="button" role="tab" data-page="view" aria-selected="false" aria-controls="page-view">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M8 2v4M16 2v4M3 10h18"/></svg>
          <span>日程</span>
        </button>
        <button type="button" role="tab" data-page="log" aria-selected="false" aria-controls="page-log">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h5"/></svg>
          <span>日志</span>
        </button>
        <button type="button" role="tab" data-page="ai" aria-selected="false" aria-controls="page-ai">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h16M6 16v-5M12 16V4M18 16V8"/></svg>
          <span>统计</span>
        </button>
        <button type="button" role="tab" data-page="me" aria-selected="false" aria-controls="page-me">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6.5 8-6.5s8 2.5 8 6.5"/></svg>
          <span>我的</span>
        </button>
      </nav>
    </div>

    <div id="appNotice" class="app-notice" role="status" aria-live="polite" hidden></div>
    <div class="overlay" id="overlay" hidden>
      <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
        <div class="sheet-head">
          <button class="sheet-back" type="button" id="sheetBack" hidden><span aria-hidden="true">‹</span>返回</button>
          <h2 id="sheetTitle">标题</h2>
          <button class="icon-close" type="button" id="sheetClose" aria-label="关闭">✕</button>
        </div>
        <div class="sheet-body" id="sheetBody"></div>
        <div class="sheet-foot" id="sheetFoot"></div>
      </div>
    </div>
  </div>
</div>

<script src="潘多拉-交互原型.js?v=6bae31d531a6" defer></script>
<script src="潘多拉-api.js?v=31d7b62a076b" defer></script>
<script src="潘多拉-任务接入.js?v=f4e1493f9be5" defer></script>
<script src="潘多拉-工作区接入.js?v=a650167348ec" defer></script>
<script src="潘多拉-日程视图.js?v=8c2f77ce04c9" defer></script>
<script src="潘多拉-任务表单.js?v=ee863ff2f2a1" defer></script>
<script src="潘多拉-个人资料.js?v=8abf51f387e7" defer></script>
<script src="潘多拉-标签评论.js?v=b54ed2d39696" defer></script>
</body>
</html>
